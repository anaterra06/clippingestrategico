<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>História 7º ano – Brasil Colônia</title>
<style>
:root{
  --bg:#f3eee3;--card:#fffdf8;--ink:#2f2a26;--muted:#6f665d;--line:#e4dccd;
  --pri:#1f7a74;--pri2:#e3f1ef;--acc:#8a4b2a;
  --ok:#1d7f4c;--okbg:#e2f3e9;--warn:#9a6a00;--warnbg:#fff2cf;--bad:#c23b3b;--badbg:#fbe7e5;
  --env:#4a5fa8;--envbg:#e7ebf8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
.hwrap{max-width:980px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font:700 19px/1.2 Georgia,"Times New Roman",serif;margin:0}
header nav button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
header nav button.on{background:#fff;color:var(--pri);font-weight:600}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.small{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.num{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);position:relative}
.num.ab::after{content:"✎";position:absolute;top:-6px;right:-4px;font-size:10px;background:var(--card);border-radius:50%;line-height:1;padding:1px}
.num.cur{outline:3px solid var(--pri);outline-offset:1px}
.num.g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.num.y{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.num.r{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.num.e{background:var(--envbg);border-color:var(--env);color:var(--env)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .lg::before{background:var(--okbg);border-color:var(--ok)}
.legend .ly::before{background:var(--warnbg);border-color:var(--warn)}
.legend .lr::before{background:var(--badbg);border-color:var(--bad)}
.legend .le::before{background:var(--envbg);border-color:var(--env)}
.legend .lab::before{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.tag{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--pri2);color:var(--pri);font-weight:600}
.tipo{font-size:12px;padding:2px 10px;border-radius:12px;background:#f3e7de;color:var(--acc);font-weight:600}
.fonte{font-size:12px;color:var(--muted)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;background:#efe9dd;border-radius:8px;padding:3px 10px}
.timer.stop{color:var(--muted)}
h2{font:700 20px/1.3 Georgia,"Times New Roman",serif;margin:6px 0 10px}
h3{font:700 17px/1.3 Georgia,"Times New Roman",serif}
.enun p{margin:0 0 10px}
.enun blockquote{margin:8px 0 12px;padding:10px 14px;background:#f7f2e8;border-left:4px solid var(--acc);border-radius:0 8px 8px 0}
.enun blockquote cite{display:block;font-size:12px;color:var(--muted);margin-top:6px;font-style:normal}
.enun figure{margin:8px 0 12px;text-align:center}
.enun figure img{max-width:100%;border-radius:8px}
.enun figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.enun svg{display:block;max-width:100%;height:auto;margin:6px auto}
.opts{display:grid;gap:8px;margin-top:10px}
.opts label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff}
.opts label:has(input:checked){border-color:var(--pri);background:var(--pri2)}
.opts label.certa{border-color:var(--ok);background:var(--okbg)}
.opts input{margin-top:5px}
textarea{width:100%;min-height:150px;font:16px/1.5 inherit;font-family:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{border-color:var(--pri);outline:none}
textarea[readonly]{background:#f7f4ee}
.cont{font-size:12px;color:var(--muted);text-align:right}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.p{background:var(--pri);color:#fff}
.btn.s{background:#ebe4d6;color:var(--ink)}
.btn.d{background:var(--badbg);color:var(--bad)}
.btn.w{background:#25a35a;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.info{background:var(--warnbg);color:var(--warn)}
.resol{margin-top:14px;border-left:4px solid var(--pri);background:#f6f9f7;border-radius:0 10px 10px 0;padding:10px 16px}
.resol h3{margin:4px 0 6px;color:var(--pri)}
.resol ul,.resol ol{margin:0;padding-left:22px}
.resol li{margin:4px 0}
.check label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{margin-top:5px;transform:scale(1.15)}
.modelo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#f8f4ec;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f1ebdf;font-size:13px}
.tw{overflow-x:auto}
.cg{color:var(--ok);font-weight:600}.cy{color:var(--warn);font-weight:600}.cr{color:var(--bad);font-weight:600}.ce{color:var(--env);font-weight:600}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.abcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.abcard .txt{white-space:pre-wrap;background:#f7f4ee;border-radius:8px;padding:8px 10px;margin:6px 0}
.abcard select{font-size:14px;padding:5px 8px;border-radius:8px;border:1px solid var(--line)}
.falta{color:var(--bad);font-size:13px}
.only-print{display:none}
@media print{.only-print{display:block}header,.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}}
</style>
</head>

{tema:T1,fonte:LD,tipo:'mc',correta:1,
 enun:'<p>A produção de açúcar no Brasil colonial seguiu o modelo chamado <b>plantation</b>. Quais eram as suas principais características?</p>',
 opcoes:['Pequenas propriedades, várias culturas (policultura), trabalho livre e produção para o mercado interno.','Grandes propriedades (latifúndios), um só produto (monocultura), mão de obra escravizada e produção voltada para a exportação.','Fazendas de gado, trabalho assalariado e produção para o consumo da própria família.','Terras da Igreja, trabalho feito pelos jesuítas e venda do açúcar apenas dentro da colônia.'],
 expl:['A plantation tinha 4 marcas: <b>latifúndio</b> (grande propriedade), <b>monocultura</b> (cana-de-açúcar), <b>mão de obra escravizada</b> e <b>exportação</b> (o açúcar ia para a Europa).','Dica para memorizar: <b>L-M-E-E</b> → Latifúndio, Monocultura, Escravidão, Exportação.','A alternativa (a) descreve quase o oposto; (c) lembra a pecuária; (d) não tem relação com os engenhos.']},
{tema:T1,fonte:LD,tipo:'mc',correta:0,
 enun:'<p>O litoral do Nordeste, principalmente <b>Pernambuco e Bahia</b>, tornou-se a principal região produtora de açúcar da colônia. Qual alternativa explica essa escolha?</p>',
 opcoes:['Solo fértil de massapê, clima quente e úmido e maior proximidade com a Europa, o que facilitava o transporte do açúcar.','Era a região onde já havia sido encontrado muito ouro.','Era a única região do Brasil sem povos indígenas.','Os holandeses proibiram que se plantasse cana em outras regiões.'],
 expl:['O <b>massapê</b> é um solo escuro e fértil, ótimo para a cana.','O <b>clima quente e úmido</b> favorecia a planta, e a <b>proximidade com a Europa</b> encurtava a viagem dos navios.','O ouro só foi encontrado no final do século XVII, em Minas Gerais; e havia muitos povos indígenas no litoral nordestino.']},
{tema:T1,fonte:PE,tipo:'ab',
 enun:'<p>No Período Açucareiro, as propriedades destinadas à produção de açúcar chamavam-se <b>engenhos de açúcar</b>.</p><p>Explique o que eram esses engenhos e aponte as principais características de sua configuração.</p>',
 pontos:['Explicou que o engenho era a grande propriedade rural onde se plantava a cana e se fabricava o açúcar.','Citou a <b>casa-grande</b>: moradia do senhor de engenho e de sua família, centro do poder.','Citou a <b>senzala</b>: alojamento onde viviam os escravizados.','Citou a <b>capela</b> e/ou a "casa do engenho" (moenda, casa das caldeiras, casa de purgar).','Mencionou os canaviais, as roças para alimentação e/ou as características da plantation (latifúndio, monocultura, escravidão, exportação).'],
 modelo:'Os engenhos eram grandes propriedades rurais (latifúndios) onde se plantava a cana e se produzia o açúcar para exportação, usando mão de obra escravizada. Eles eram formados pela casa-grande, onde morava o senhor de engenho com sua família; pela senzala, onde viviam os escravizados; pela capela, onde aconteciam missas, batizados e casamentos; e pela casa do engenho, com a moenda (que esmagava a cana), a casa das caldeiras (onde o caldo era fervido) e a casa de purgar (onde o açúcar era branqueado e secado). Havia ainda os canaviais e pequenas roças e pastos para alimentar as pessoas e os animais.'},
{tema:T1,fonte:LD,tipo:'mc',correta:2,
 enun:'<p>Na casa do engenho, o açúcar passava por várias etapas. Qual é a ordem correta?</p>',
 opcoes:['Casa de purgar → moenda → casa das caldeiras.','Casa das caldeiras → casa de purgar → moenda.','Moenda (esmagar a cana e tirar o caldo) → casa das caldeiras (ferver o caldo) → casa de purgar (branquear e secar o açúcar).','Senzala → capela → casa-grande.'],
 expl:['Primeiro a cana precisava ser <b>esmagada na moenda</b> para tirar o caldo (garapa).','Depois o caldo era <b>fervido nas caldeiras</b> até engrossar (melaço).','Por fim, na <b>casa de purgar</b>, o açúcar era colocado em formas para branquear e secar.','A alternativa (d) cita construções do engenho, mas não as etapas de fabricação.']},
{tema:T1,fonte:SL,tipo:'ab',
 enun:'<p>Como funcionava a <b>sociedade colonial açucareira</b>? Quais eram as suas principais características?</p>',
 pontos:['Disse que era uma sociedade <b>rural</b>, organizada em torno do engenho.','Disse que era <b>patriarcal</b>: o senhor de engenho mandava na família, nos agregados e nos escravizados (e tinha poder político).','Disse que era muito <b>hierarquizada</b>, com pouca mobilidade social (era difícil mudar de posição).','Citou os grupos: senhores de engenho, trabalhadores livres (lavradores, feitores, mestres de açúcar, padres) e escravizados.','Destacou que a base de tudo era o trabalho escravizado de africanos (e também de indígenas).'],
 modelo:'A sociedade açucareira era rural e girava em torno do engenho. Era patriarcal, ou seja, o senhor de engenho era a maior autoridade: mandava na esposa, nos filhos, nos agregados e nos escravizados, e também tinha poder político nas câmaras municipais. Era uma sociedade muito hierarquizada e com pouca mobilidade social. No topo estavam os senhores de engenho; no meio, trabalhadores livres, como lavradores, feitores, mestres de açúcar, artesãos e padres; e na base, a grande maioria: os africanos escravizados (e também indígenas), que faziam quase todo o trabalho.'},
{tema:T1,fonte:LD,tipo:'mc',correta:3,
 enun:'<p>Antes das invasões holandesas, Portugal e Holanda eram parceiros no negócio do açúcar. Qual era o papel dos holandeses nessa parceria?</p>',
 opcoes:['Eram os donos de todos os engenhos do Brasil.','Forneciam os padres jesuítas que trabalhavam nos engenhos.','Plantavam a cana no Brasil com trabalhadores holandeses.','Financiavam a instalação de engenhos e transportavam, refinavam e distribuíam o açúcar na Europa.'],
 expl:['Os holandeses entravam com o <b>dinheiro (financiamento)</b>, os <b>navios</b>, as <b>refinarias</b> e o <b>comércio</b> do açúcar na Europa.','Portugal e os senhores de engenho cuidavam da <b>produção</b> na colônia.','Por isso, quando essa parceria foi rompida durante a União Ibérica, os holandeses decidiram invadir o Nordeste.']},
{tema:T1,fonte:PE,tipo:'ab',
 enun:'<p>Como era o <b>trabalho dos escravizados</b> nos engenhos? Como eram as <b>condições de vida</b> desses escravizados?</p>',
 pontos:['Disse que trabalhavam em praticamente todas as etapas: plantio, corte da cana, moenda, caldeiras e também serviços domésticos.','Mencionou jornadas muito longas (mais de 15 horas na época da safra) e trabalho perigoso (acidentes na moenda e nas caldeiras).','Mencionou a vigilância dos feitores e os castigos físicos violentos (chicote, tronco).','Descreveu as condições de vida: senzalas precárias, pouca comida, roupas ruins e muitas doenças.','Concluiu que eram tratados como mercadoria e que muitos morriam poucos anos depois de chegar.'],
 modelo:'Os escravizados faziam quase todo o trabalho do engenho: preparavam a terra, plantavam e cortavam a cana, trabalhavam na moenda, nas caldeiras e na casa de purgar, e também nos serviços da casa-grande. Na época da safra, as jornadas podiam passar de 15 horas por dia, e o trabalho era perigoso: muitos perdiam mãos e braços na moenda ou se queimavam nas caldeiras. Eram vigiados por feitores e sofriam castigos violentos, como chicotadas e o tronco. Viviam nas senzalas, lugares apertados e sem conforto, recebiam pouca comida e roupas ruins, e adoeciam com frequência. Como eram tratados como mercadoria, muitos morriam poucos anos depois de chegar ao Brasil.'},
{tema:T1,fonte:LD,tipo:'mc',correta:2,
 enun:'<p>Os africanos escravizados resistiram de muitas formas. Qual das alternativas abaixo <b>NÃO</b> é uma forma de resistência à escravidão?</p>',
 opcoes:['Fugir e formar quilombos.','Fazer o trabalho devagar, quebrar ferramentas ou sabotar a produção.','Assinar contratos com o senhor de engenho para passar a receber salário.','Manter vivas línguas, religiões, danças e lutas de origem africana, como a capoeira.'],
 expl:['Fugas, quilombos, sabotagem e a preservação da cultura africana foram formas reais de <b>resistência</b>.','Escravizados <b>não tinham direito a contrato nem a salário</b>: eram considerados propriedade do senhor. Por isso a alternativa (c) não descreve uma forma de resistência — ela nem era possível.']},
{tema:T1,fonte:PE,tipo:'ab',
 enun:'<p>Sobre a relação entre os senhores de engenho e a exploração dos escravizados, responda: havia resistência dos escravizados ou a escravidão era aceita pacificamente?</p><p>Justifique sua resposta.</p>',
 pontos:['Respondeu que <b>havia resistência</b>: a escravidão nunca foi aceita pacificamente.','Citou fugas e a formação de quilombos (por exemplo, Palmares).','Citou a resistência do dia a dia: trabalho lento, sabotagem, quebra de ferramentas, revoltas.','Citou a resistência cultural: manter religiões, línguas, festas, músicas e a capoeira.','Justificou com um argumento (ex.: os senhores precisavam de feitores, castigos e capitães do mato justamente porque havia resistência).'],
 modelo:'Havia resistência. A escravidão nunca foi aceita pacificamente pelos africanos e seus descendentes. Muitos fugiam e formavam quilombos, como o Quilombo dos Palmares. No dia a dia, também resistiam trabalhando devagar, quebrando ferramentas, sabotando a produção ou organizando revoltas. Outra forma de resistência era cultural: preservar suas religiões, línguas, festas, músicas e lutas, como a capoeira. Prova disso é que os senhores precisavam de feitores, castigos e capitães do mato para tentar controlar os escravizados.'},
{tema:T1,fonte:LD,tipo:'mc',correta:1,
 enun:'<p>Sobre o <b>Quilombo dos Palmares</b>, é correto afirmar:</p>',
 opcoes:['Ficava em Minas Gerais e foi destruído pelos holandeses em 1630.','Ficava na Serra da Barriga (atual Alagoas), resistiu por quase um século e teve Zumbi como um de seus principais líderes.','Era formado apenas por africanos e não plantava alimentos, vivendo só de saques.','Foi o único quilombo que existiu no Brasil.'],
 expl:['Palmares ficava na <b>Serra da Barriga</b>, no atual estado de <b>Alagoas</b>, e durou quase todo o século XVII.','Reunia milhares de pessoas — africanos, descendentes, indígenas e pobres livres — que plantavam, criavam animais e comerciavam.','Teve líderes como <b>Ganga Zumba</b> e <b>Zumbi</b>. Foi destruído em 1694 por tropas comandadas pelo bandeirante Domingos Jorge Velho.','Houve centenas de quilombos pelo Brasil, como diz o texto da Biblioteca Nacional.']},
{tema:T1,fonte:PE,tipo:'ab',
 enun:'<p>Leia o texto sobre o Quilombo dos Palmares para responder à questão.</p><blockquote>O Quilombo de Palmares, no século XVII, em Alagoas, tornou-se uma referência na história da resistência dos negros à escravidão. Até hoje, quando se fala em resistência negra à escravidão se é induzido a pensar em Zumbi dos Palmares e no quilombo que ele liderou. Mas esse famoso quilombo não foi o único a existir, muito pelo contrário, eles multiplicaram-se pelo Brasil como forma de organização de resistência dos negros fugidos do trabalho escravo.<cite>BIBLIOTECA NACIONAL. Tráficos de escravos no Brasil. Biblioteca Nacional Digital, 2020.</cite></blockquote><p>Com base no texto, responda: O que era um <b>quilombo</b>? Por que o <b>Quilombo de Palmares</b> se destacou nesse período?</p>',
 pontos:['Explicou que quilombo era uma comunidade formada por escravizados fugidos (e às vezes indígenas e pobres livres), em lugares de difícil acesso.','Disse que o quilombo era uma forma de resistência e de viver em liberdade, com plantações, comércio e organização própria.','Disse que Palmares se destacou pelo <b>tamanho</b> (milhares de pessoas, vários povoados) e pela <b>duração</b> (quase um século).','Mencionou que resistiu a várias expedições e só foi destruído em 1694 (bandeirante Domingos Jorge Velho); Zumbi morreu em 1695.','Disse que Palmares virou símbolo da resistência negra (Dia da Consciência Negra, 20 de novembro).'],
 modelo:'Quilombo era uma comunidade formada por pessoas escravizadas que fugiam, geralmente em lugares de difícil acesso, como matas e serras. Lá também podiam viver indígenas e pobres livres. Os quilombolas plantavam, criavam animais, comerciavam e tinham sua própria organização. Era uma forma de resistir à escravidão e de viver em liberdade. Palmares se destacou porque foi o maior e mais duradouro quilombo: reuniu milhares de pessoas em vários povoados na Serra da Barriga e resistiu por quase cem anos a muitos ataques. Só foi destruído em 1694, por tropas do bandeirante Domingos Jorge Velho, e Zumbi foi morto em 1695. Por isso, Palmares e Zumbi se tornaram símbolos da resistência negra.'},
{tema:T1,fonte:LD,tipo:'mc',correta:0,
 enun:'<p>O dia <b>20 de novembro</b> é o Dia Nacional de Zumbi e da Consciência Negra. Essa data foi escolhida porque lembra:</p>',
 opcoes:['A morte de Zumbi dos Palmares, em 1695, símbolo da luta contra a escravidão.','A assinatura da Lei Áurea, que aboliu a escravidão.','A chegada dos primeiros africanos escravizados ao Brasil.','A vitória dos senhores de engenho contra os holandeses.'],
 expl:['Zumbi foi morto em <b>20 de novembro de 1695</b>, depois da destruição de Palmares.','A data valoriza a <b>resistência</b> dos negros, e não um ato do governo.','A Lei Áurea foi assinada em <b>13 de maio de 1888</b> — por isso a alternativa (b) está errada.']},

/* ===================== BANDEIRAS ===================== */
{tema:T2,fonte:SL,tipo:'mc',correta:2,
 enun:'<p>No período colonial, foram organizadas expedições para o interior chamadas <b>entradas</b> e <b>bandeiras</b>. Qual a principal diferença entre elas?</p>',
 opcoes:['As entradas iam para o litoral e as bandeiras iam para o interior.','As entradas eram feitas por indígenas e as bandeiras por jesuítas.','As entradas eram financiadas pela Coroa portuguesa; as bandeiras eram organizadas por particulares.','Não havia diferença: as duas eram organizadas pelos holandeses.'],
 expl:['<b>Entradas</b> = expedições <b>oficiais</b>, pagas pela Coroa portuguesa.','<b>Bandeiras</b> = expedições <b>particulares</b>, organizadas principalmente por moradores de São Paulo (os bandeirantes).','As duas iam para o interior do território.']},
{tema:T2,fonte:SL,tipo:'mc',correta:1,
 enun:'<p>A maior parte das bandeiras partiu da vila de <b>São Paulo</b>, na Capitania de São Vicente. Por que os moradores dessa região se dedicaram às bandeiras?</p>',
 opcoes:['Porque São Paulo era a capital da colônia e a cidade mais rica.','Porque a região era pobre e afastada dos grandes centros açucareiros, e muitos buscavam no sertão indígenas para escravizar e metais preciosos.','Porque já existiam grandes minas de ouro em São Paulo desde 1500.','Porque os holandeses tinham ocupado São Paulo.'],
 expl:['O açúcar não prosperou tanto em São Vicente quanto no Nordeste. A vila de São Paulo vivia de <b>subsistência e pecuária</b> e era pobre.','Por isso, as expedições ao interior eram uma forma de <b>enriquecer</b>: capturar indígenas e procurar ouro e prata.','A capital era Salvador, e os holandeses ocuparam o Nordeste, não São Paulo.']},
{tema:T2,fonte:LD,tipo:'mc',correta:0,
 enun:'<p>Quem formava a maior parte dos grupos das bandeiras?</p>',
 opcoes:['Mamelucos (filhos de europeus com indígenas) e indígenas, muitos falando a língua geral, de origem tupi.','Soldados holandeses contratados pela Companhia das Índias.','Nobres portugueses vindos de Lisboa.','Padres jesuítas e seus alunos.'],
 expl:['As bandeiras reuniam paulistas, muitos deles <b>mamelucos</b>, e grande número de <b>indígenas</b>, que conheciam as matas, os rios e as técnicas de sobrevivência.','Em São Paulo falava-se muito a <b>língua geral</b>, baseada no tupi.']},
{tema:T2,fonte:PE,tipo:'ab',
 enun:'<p>As bandeiras foram expedições de caráter particular que adentravam no interior das possessões portuguesas na América.</p><p>Aponte as diferenças entre as <b>bandeiras de apresamento</b> e as <b>bandeiras de prospecção</b>.</p>',
 pontos:['Explicou que o objetivo do <b>apresamento</b> era capturar indígenas para vendê-los como escravizados.','Mencionou que o apresamento atacava aldeias e missões jesuíticas, gerando conflitos com os jesuítas.','Explicou que o objetivo da <b>prospecção</b> era procurar riquezas minerais (ouro, prata, pedras preciosas).','Mencionou que a prospecção levou à descoberta de ouro em Minas Gerais no final do século XVII (e depois em Goiás e Mato Grosso).'],
 modelo:'As bandeiras de apresamento tinham como objetivo capturar indígenas para vendê-los como mão de obra escravizada. Elas atacavam aldeias e principalmente as missões jesuíticas, onde muitos indígenas viviam reunidos, o que causou conflitos com os jesuítas, que eram contra a escravização dos indígenas. Já as bandeiras de prospecção exploravam o território em busca de riquezas minerais, como ouro, prata e pedras preciosas. Foram elas que descobriram ouro na região de Minas Gerais no final do século XVII e, depois, em Goiás e Mato Grosso.'},
{tema:T2,fonte:SL,tipo:'mc',correta:3,
 enun:'<p>As bandeiras de apresamento entraram em conflito com os <b>jesuítas</b>. Por quê?</p>',
 opcoes:['Porque os jesuítas queriam o ouro encontrado pelos bandeirantes.','Porque os jesuítas eram aliados dos holandeses.','Porque os bandeirantes queriam construir igrejas no lugar das missões.','Porque os bandeirantes atacavam as missões, onde viviam muitos indígenas reunidos, e os jesuítas eram contra a escravização dos indígenas.'],
 expl:['Nas <b>missões</b> (ou reduções), os jesuítas reuniam muitos indígenas para catequizá-los.','Para os bandeirantes, isso facilitava a captura de muitas pessoas de uma vez. Várias missões foram atacadas e destruídas, como as do Guairá (no atual Paraná).','Os jesuítas <b>condenavam a escravização indígena</b>, por isso o conflito.']},
{tema:T2,fonte:SL,tipo:'mc',correta:1,
 enun:'<p>O que foi o <b>sertanismo de contrato</b>?</p>',
 opcoes:['Expedições da Coroa para fundar vilas no litoral.','Contratação de bandeirantes por senhores de engenho e autoridades para capturar escravizados fugidos e destruir quilombos.','Acordo entre jesuítas e indígenas para proteger as missões.','Contrato entre Portugal e Espanha para dividir o território.'],
 expl:['No sertanismo de contrato, os bandeirantes eram <b>pagos</b> por senhores de engenho e autoridades coloniais.','A missão era <b>recapturar escravizados fugidos</b> e <b>destruir quilombos</b>.','O exemplo mais conhecido é <b>Domingos Jorge Velho</b>, contratado para destruir o Quilombo dos Palmares (1694).']},
{tema:T2,fonte:LD,tipo:'mc',correta:2,
 enun:'<p>Durante o domínio holandês no Nordeste e em Angola, na África (século XVII), as bandeiras de apresamento se intensificaram. Por quê?</p>',
 opcoes:['Porque os holandeses pagavam os bandeirantes para capturar jesuítas.','Porque os indígenas pediam para trabalhar nos engenhos.','Porque o tráfico de africanos para a parte portuguesa da colônia foi prejudicado, e aumentou a procura por indígenas escravizados.','Porque o ouro já tinha acabado em Minas Gerais.'],
 expl:['Os holandeses passaram a controlar áreas de onde saíam africanos escravizados (como Angola).','Com menos africanos chegando, os senhores de engenho buscaram mais <b>indígenas escravizados</b> — e os bandeirantes lucraram com isso.','O ouro em Minas só seria descoberto no final do século XVII.']},
{tema:T2,fonte:LD,tipo:'mc',correta:0,
 enun:'<p>Entre 1580 e 1640, Portugal e Espanha tiveram o mesmo rei (União Ibérica). Como isso afetou as bandeiras?</p>',
 opcoes:['Como os dois reinos tinham o mesmo rei, a linha do Tratado de Tordesilhas perdeu importância na prática, facilitando o avanço dos bandeirantes para terras que seriam espanholas.','Os bandeirantes foram proibidos de sair de São Paulo.','A Espanha enviou soldados para acompanhar todas as bandeiras.','As bandeiras passaram a ir somente para a África.'],
 expl:['Com <b>um só rei</b> para Portugal e Espanha, a divisão de Tordesilhas ficou menos vigiada.','Isso ajudou os bandeirantes a ocupar terras a oeste da linha — algo que, mais tarde, Portugal precisou garantir no <b>Tratado de Madri (1750)</b>.']},
{tema:T2,fonte:PE,tipo:'ab',
 enun:'<p>Quais foram as <b>consequências</b> das bandeiras de prospecção?</p>',
 pontos:['Citou a descoberta de ouro e diamantes (Minas Gerais, Goiás e Mato Grosso) no final do século XVII e no século XVIII.','Citou a expansão do território português para além da linha de Tordesilhas (interiorização), depois reconhecida pelo Tratado de Madri (1750).','Citou a mudança do eixo econômico do Nordeste açucareiro para a região das minas (corrida do ouro, migração, novas vilas).','Citou o aumento do tráfico de escravizados e/ou o maior controle da Coroa (impostos).','Citou consequências negativas: violência contra indígenas, destruição de aldeias, conflitos (ex.: Guerra dos Emboabas).'],
 modelo:'As bandeiras de prospecção encontraram ouro e diamantes em Minas Gerais, no final do século XVII, e depois em Goiás e Mato Grosso. Isso provocou uma corrida do ouro: muita gente migrou para a região, surgiram vilas e cidades, e o centro da economia colonial se deslocou do Nordeste açucareiro para as minas. As bandeiras também ampliaram o território português para muito além da linha de Tordesilhas, o que depois foi reconhecido pelo Tratado de Madri (1750). Outras consequências foram o aumento do tráfico de africanos escravizados, o maior controle e cobrança de impostos pela Coroa, a violência contra os povos indígenas e conflitos pelo ouro, como a Guerra dos Emboabas.'},
{tema:T2,fonte:SL,tipo:'mc',correta:3,
 enun:'<p>"Os bandeirantes: heróis ou vilões?" Qual alternativa apresenta a visão mais adequada da História sobre eles?</p>',
 opcoes:['Foram apenas heróis, pois todas as suas ações trouxeram benefícios para todos.','Foram apenas vilões, e não tiveram nenhuma importância para a formação do território.','Foram funcionários da Igreja encarregados de proteger os indígenas.','Ampliaram o território e encontraram ouro, mas também escravizaram e mataram indígenas e destruíram quilombos; por isso existem diferentes interpretações sobre eles.'],
 expl:['A História mostra os <b>dois lados</b>: os bandeirantes ampliaram o território e descobriram ouro, mas foram responsáveis por muita <b>violência</b> contra indígenas e quilombolas.','Durante muito tempo foram retratados como heróis (como nas estátuas e pinturas do início do século XX). Hoje os historiadores também destacam as vítimas dessas expedições.','Como diz o material: "há várias versões e interpretações possíveis para um único fato histórico".']},

/* ===================== INVASÕES ESTRANGEIRAS ===================== */
{tema:T3,fonte:SL,tipo:'mc',correta:1,
 enun:'<p>Como começou a <b>União Ibérica</b> (1580–1640)?</p>',
 opcoes:['Portugal venceu uma guerra e passou a governar a Espanha.','O rei D. Sebastião morreu na batalha de Alcácer-Quibir (1578) sem deixar herdeiros; após a morte do cardeal D. Henrique (1580), o rei Filipe II da Espanha assumiu o trono português.','Os holandeses ofereceram o trono português ao rei da Espanha.','O papa decidiu unir os dois reinos para dividir o Brasil.'],
 expl:['D. Sebastião desapareceu na batalha de Alcácer-Quibir (norte da África), em 1578, <b>sem filhos</b>.','O trono ficou com seu tio-avô, o cardeal <b>D. Henrique</b>, que era idoso e morreu em 1580.','<b>Filipe II da Espanha</b>, parente da família real portuguesa, assumiu o trono: começou a <b>dinastia Filipina</b>.','Muitos portugueses passaram a acreditar que D. Sebastião voltaria para salvar o reino — o <b>sebastianismo</b>.']},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>Entre os anos de 1580 e 1640, Portugal integrou, com a Espanha, a chamada <b>União Ibérica</b>.</p><p>Nesse contexto, uma série de fatores levou o Império português à decadência. Explique esses fatores.</p>',
 pontos:['Explicou que Portugal passou a ser governado pelo rei da Espanha e "herdou" os inimigos espanhóis (Holanda, Inglaterra, França).','Explicou que a Espanha, em guerra com a Holanda (Guerra dos 80 anos), proibiu o comércio holandês com Portugal, rompendo a parceria do açúcar.','Citou ataques e perdas de colônias e feitorias portuguesas (Ásia, África) e as invasões holandesas no Brasil.','Citou a perda de autonomia política e econômica de Portugal (decisões e interesses espanhóis em primeiro lugar).','Mencionou a Restauração (1640), quando Portugal recuperou a independência, mas já enfraquecido.'],
 modelo:'Durante a União Ibérica, Portugal passou a ser governado pelos reis da Espanha e perdeu autonomia: as decisões atendiam primeiro aos interesses espanhóis. Com isso, Portugal também passou a ter os inimigos da Espanha, como Holanda, Inglaterra e França. A Espanha estava em guerra com a Holanda (Guerra dos 80 anos) e proibiu os holandeses de negociar nos portos portugueses, rompendo a antiga parceria no comércio do açúcar. Em resposta, os holandeses atacaram e tomaram muitas colônias e feitorias portuguesas na Ásia e na África e invadiram o Nordeste do Brasil. Quando Portugal recuperou a independência, em 1640 (Restauração), com D. João IV, o império estava enfraquecido e havia perdido muitas áreas.'},
{tema:T3,fonte:SL,tipo:'mc',correta:0,
 enun:'<p>Por que os holandeses decidiram invadir o Nordeste do Brasil no século XVII?</p>',
 opcoes:['Porque a Espanha, em guerra com a Holanda, proibiu o comércio holandês com Portugal e suas colônias, e os holandeses queriam recuperar o lucrativo negócio do açúcar.','Porque queriam encontrar ouro em Minas Gerais.','Porque Portugal pediu ajuda para combater os franceses.','Porque desejavam acabar com a escravidão no Brasil.'],
 expl:['Os holandeses lucravam muito com o açúcar brasileiro (financiavam, refinavam e vendiam).','Com a União Ibérica, a Espanha — inimiga da Holanda — <b>cortou esse comércio</b>.','A solução holandesa foi criar a <b>Companhia das Índias Ocidentais (1621)</b> e tomar diretamente a região produtora de açúcar.','Os holandeses mantiveram e até usaram o tráfico de escravizados — não queriam acabar com a escravidão.']},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>A <b>Companhia Holandesa das Índias Ocidentais</b> era muito importante no século XVII. Qual foi o papel desempenhado por ela no contexto brasileiro?</p>',
 pontos:['Explicou que era uma empresa holandesa (criada em 1621) com capital de comerciantes e apoio do governo, voltada ao comércio e à conquista no Atlântico.','Disse que ela organizou e financiou as invasões ao Brasil: Bahia (1624) e Pernambuco (1630).','Disse que administrou o Brasil Holandês, controlando a produção e o comércio do açúcar (e enviou Maurício de Nassau).','Mencionou o controle do tráfico de africanos escravizados (conquista de áreas na África, como Angola), garantindo mão de obra.','Mencionou que a cobrança das dívidas pela Companhia ajudou a provocar a Insurreição Pernambucana.'],
 modelo:'A Companhia das Índias Ocidentais foi criada em 1621 por comerciantes holandeses, com apoio do governo, para lucrar com o comércio e a conquista de territórios no Atlântico. No Brasil, foi ela que organizou e financiou as invasões: primeiro na Bahia (1624) e depois em Pernambuco (1630). A Companhia administrou o Brasil Holandês, controlando a produção e o comércio do açúcar, e enviou Maurício de Nassau para governar. Também conquistou áreas na África, como Angola, para controlar o tráfico de escravizados e garantir mão de obra para os engenhos. Mais tarde, a cobrança rigorosa das dívidas dos senhores de engenho pela Companhia foi um dos motivos da Insurreição Pernambucana.'},
{tema:T3,fonte:SL,tipo:'mc',correta:2,
 enun:'<p>Qual foi a <b>primeira</b> região invadida pelos holandeses no Brasil, e o que aconteceu?</p>',
 opcoes:['Recife, em 1630; os holandeses ficaram apenas um mês.','São Paulo, em 1610; os bandeirantes expulsaram os holandeses.','Salvador, na Bahia, capital da colônia, em 1624; os holandeses foram expulsos em 1625 por uma grande esquadra luso-espanhola.','Rio de Janeiro, em 1555; os holandeses fundaram a França Antártica.'],
 expl:['A primeira invasão foi em <b>Salvador (1624)</b>, então capital da colônia.','Em <b>1625</b>, uma grande frota enviada pela Espanha e Portugal (a "Jornada dos Vassalos") expulsou os holandeses.','A França Antártica (Rio de Janeiro, 1555) foi uma invasão <b>francesa</b>, não holandesa.']},
{tema:T3,fonte:SL,tipo:'mc',correta:1,
 enun:'<p>Em 1630, os holandeses fizeram uma nova invasão, dessa vez bem-sucedida. Onde, e por que essa região foi escolhida?</p>',
 opcoes:['No Maranhão, porque lá havia muito ouro.','Em Pernambuco (Olinda e Recife), a região de maior produção de açúcar da colônia.','Em São Vicente, porque era a capitania mais rica.','No Rio Grande do Sul, para criar gado.'],
 expl:['Em 1630, os holandeses tomaram <b>Olinda e Recife</b>, em Pernambuco.','Pernambuco era a área de <b>maior desenvolvimento açucareiro</b> — justamente o que interessava à Companhia.','O Recife se tornou a capital do Brasil Holandês.']},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>Durante o domínio holandês no Brasil colonial, <b>Maurício de Nassau</b> atuou como governante e representante da Holanda nos domínios do Nordeste.</p><p>Por que esse período é considerado o <b>auge</b> da ocupação holandesa? Explique.</p>',
 pontos:['Mencionou que Nassau governou de 1637 a 1644, um período de relativa paz e consolidação do domínio holandês.','Explicou que ele recuperou a produção de açúcar, emprestando dinheiro aos senhores de engenho (e vendendo engenhos abandonados).','Mencionou o controle do tráfico de escravizados (conquista de Angola), garantindo mão de obra.','Citou as obras no Recife: porto, pontes, canais, calçamento, iluminação, Jardim Botânico, observatório, museu.','Citou a tolerância religiosa (católicos, protestantes e judeus), a Câmara dos Escabinos e/ou a vinda de artistas e cientistas (Frans Post, Albert Eckhout).'],
 modelo:'O governo de Maurício de Nassau (1637–1644) é considerado o auge da ocupação holandesa porque foi um período de relativa paz e de consolidação do domínio holandês em Pernambuco. Nassau recuperou a produção de açúcar emprestando dinheiro aos senhores de engenho e vendendo engenhos abandonados; e, com o controle holandês do tráfico de escravizados, garantiu mão de obra. Ele modernizou o Recife, com melhorias no porto, pontes, canais, calçamento e iluminação, além de um Jardim Botânico, um museu e um observatório astronômico. Também permitiu certa liberdade religiosa a católicos, protestantes e judeus, criou a Câmara dos Escabinos (com participação de luso-brasileiros) e trouxe artistas e cientistas, como os pintores Frans Post e Albert Eckhout.'},
{tema:T3,fonte:SL,tipo:'mc',correta:3,
 enun:'<p>Maurício de Nassau trouxe para o Brasil artistas que retrataram paisagens, pessoas, plantas e animais da colônia (a chamada "missão artística"). Quem eram eles?</p>',
 opcoes:['Aleijadinho e Mestre Ataíde.','Victor Meirelles e Pedro Américo.','Padre Antônio Vieira e Gregório de Matos.','Frans Post e Albert Eckhout.'],
 expl:['<b>Frans Post</b> pintou paisagens do Nordeste e <b>Albert Eckhout</b> retratou indígenas, africanos, frutas e animais — como as pinturas mostradas no material da aula (página 172).','Aleijadinho e Mestre Ataíde são artistas do <b>barroco mineiro</b> (século XVIII).','Victor Meirelles e Pedro Américo pintaram no <b>século XIX</b>.']},
{tema:T3,fonte:LD,tipo:'mc',correta:0,
 enun:'<p>A tolerância religiosa no governo de Nassau permitiu que fosse construída no Recife:</p>',
 opcoes:['A primeira sinagoga (templo judaico) das Américas, a Kahal Zur Israel.','A primeira mesquita do Brasil.','A maior igreja barroca do mundo.','A sede da Companhia de Jesus (jesuítas) no Brasil.'],
 expl:['Os holandeses eram <b>protestantes (calvinistas)</b>, mas Nassau permitiu certa liberdade a católicos e judeus.','Muitos judeus se estabeleceram no Recife e construíram a <b>Kahal Zur Israel</b>, a primeira sinagoga das Américas.','Ela funcionava na Rua dos Judeus (hoje Rua do Bom Jesus) e pode ser visitada até hoje.']},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>Leia o texto do historiador Boris Fausto para responder à próxima questão.</p><blockquote>O nativismo de Pernambuco teve conteúdo variado, ao longo dos anos, de acordo com as situações históricas específicas e os grupos sociais envolvidos, mas manteve-se como referência básica no imaginário pernambucano.<cite>FAUSTO, Boris. História do Brasil. São Paulo: Edusp, 1994. p. 89.</cite></blockquote><p>O contexto das invasões holandesas se relaciona com o nascimento de uma nova organização entre as pessoas que viviam nas regiões ocupadas pela Holanda. Relacione essas duas informações e explique o motivo de esse movimento ter surgido.</p>',
 pontos:['Explicou que, na luta contra os holandeses, pessoas de origens diferentes (luso-brasileiros, negros e indígenas) se uniram contra um inimigo comum.','Citou exemplos: Henrique Dias (negro liberto), Filipe Camarão e Clara Camarão (indígenas potiguares), João Fernandes Vieira, André Vidal de Negreiros.','Explicou o nativismo: um sentimento de ligação com a terra, de lutar por causas próprias da região (primeira ideia de "identidade").','Explicou os motivos: cobrança das dívidas pela Companhia após a saída de Nassau, diferenças religiosas (católicos x protestantes) e rejeição ao domínio estrangeiro.','Relacionou com o texto: esse sentimento se tornou uma referência duradoura no imaginário pernambucano.'],
 modelo:'Durante as invasões holandesas, as pessoas que viviam em Pernambuco — senhores de engenho, lavradores, negros libertos e escravizados, e indígenas — se uniram para lutar contra um inimigo comum. Líderes como João Fernandes Vieira, André Vidal de Negreiros, Henrique Dias (que comandava uma tropa de negros) e o indígena potiguar Filipe Camarão (com sua esposa, Clara Camarão) participaram da luta. Daí nasceu o nativismo: um sentimento de ligação com a terra e de lutar por interesses próprios da região, não só de Portugal. O movimento surgiu porque, depois da saída de Nassau, a Companhia passou a cobrar com rigor as dívidas dos senhores de engenho, havia diferenças religiosas entre católicos e protestantes e crescia a rejeição ao domínio estrangeiro. Como diz Boris Fausto, esse sentimento se manteve como uma referência importante na memória pernambucana.'},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>A <b>Insurreição Pernambucana</b> foi um dos movimentos que ocorreram no contexto das invasões holandesas no período colonial. Explique qual era o <b>objetivo</b> do movimento e sua <b>relação com o Império português</b>.</p>',
 pontos:['Disse que o objetivo era expulsar os holandeses de Pernambuco/Nordeste (movimento iniciado em 1645).','Explicou o contexto: Restauração portuguesa (1640) e saída de Nassau (1644), com a Companhia cobrando as dívidas dos senhores de engenho.','Explicou a relação com Portugal: os rebeldes queriam devolver a região ao domínio português; Portugal, recém-restaurado e com acordos de trégua com a Holanda, apoiou no início de forma discreta.','Citou as Batalhas dos Guararapes (1648 e 1649) e/ou a rendição holandesa em 1654.','Citou a Paz de Haia (1661), em que Portugal pagou indenização à Holanda.'],
 modelo:'O objetivo da Insurreição Pernambucana, iniciada em 1645, era expulsar os holandeses de Pernambuco e do Nordeste. Ela aconteceu depois que Portugal recuperou sua independência da Espanha (Restauração, 1640) e após a saída de Nassau (1644), quando a Companhia das Índias Ocidentais passou a cobrar com rigor as dívidas dos senhores de engenho. Os rebeldes lutavam para que a região voltasse a pertencer a Portugal. O governo português, porém, estava fraco e tinha acordos de trégua com a Holanda; por isso, no início, apoiou o movimento apenas de forma discreta. Depois das vitórias nas Batalhas dos Guararapes (1648 e 1649), os holandeses se renderam em 1654. Em 1661, pela Paz de Haia, Portugal pagou uma indenização à Holanda para encerrar oficialmente o conflito.'},
{tema:T3,fonte:PE,tipo:'ab',
 enun:'<p>No contexto da Insurreição Pernambucana contra o domínio holandês, identifique o <b>fator determinante</b> para a adesão dos senhores de engenho ao movimento.</p>',
 pontos:['Identificou o fator determinante: o interesse econômico — as dívidas com a Companhia das Índias Ocidentais.','Explicou que, após a saída de Nassau (1644), a Companhia passou a cobrar com rigor os empréstimos, ameaçando tomar os engenhos.','Explicou que expulsar os holandeses significava livrar-se das dívidas (os líderes declararam nulas as dívidas com os holandeses).','Mencionou outros fatores secundários (religião católica x protestante, Restauração portuguesa), mas destacou o econômico como decisivo.'],
 modelo:'O fator determinante foi o interesse econômico dos senhores de engenho. Durante o governo de Nassau, muitos haviam pegado empréstimos com a Companhia das Índias Ocidentais. Depois que Nassau saiu, em 1644, a Companhia passou a cobrar essas dívidas com rigor, ameaçando tomar os engenhos de quem não pagasse. Expulsar os holandeses era uma forma de se livrar dessas dívidas — tanto que uma das primeiras medidas do líder João Fernandes Vieira foi declarar nulas as dívidas com os holandeses. Questões religiosas (católicos contra protestantes) e a Restauração portuguesa também contribuíram, mas o motivo principal foi econômico.'},
{tema:T3,fonte:SE,tipo:'mc',correta:4,
 enun:'<blockquote>A rebelião luso-brasileira em Pernambuco começou a ser urdida em 1644 e explodiu em 13 de junho de 1645, dia de Santo Antônio. Uma das primeiras medidas de João Fernandes foi decretar nulas as dívidas que os rebeldes tinham com os holandeses. Houve grande adesão da "nobreza da terra", entusiasmada com esta proclamação heroica.<cite>VAINFAS, R. Guerra declarada e paz fingida na restauração portuguesa. Tempo, n. 27, 2009.</cite></blockquote><p>O desencadeamento dessa revolta na América portuguesa seiscentista foi o resultado do(a):</p>',
 opcoes:['fraqueza bélica dos protestantes batavos.','comércio transatlântico da África ocidental.','auxílio financeiro dos negociantes flamengos.','diplomacia internacional dos Estados ibéricos.','interesse econômico dos senhores de engenho.'],
 expl:['A pista está no texto: João Fernandes Vieira <b>anulou as dívidas</b> com os holandeses, e a "nobreza da terra" (os senhores de engenho) aderiu com entusiasmo.','Ou seja, o que motivou a revolta foi o <b>interesse econômico dos senhores de engenho</b>, endividados com a Companhia.','Vocabulário: "urdida" = planejada; "batavos" e "flamengos" = holandeses; "seiscentista" = do século XVII (anos 1600).']},
{tema:T3,fonte:SL,tipo:'mc',correta:2,
 enun:'<figure><img src="'+IMG_GUARARAPES+'" alt="Pintura de uma grande batalha com soldados a pé e a cavalo"><figcaption>MEIRELLES, Victor. <i>Batalha dos Guararapes</i>, 1875–1879. Óleo sobre tela. Museu Nacional de Belas Artes (RJ).</figcaption></figure><p>A pintura representa as <b>Batalhas dos Guararapes</b> (1648 e 1649). Essas batalhas foram importantes porque:</p>',
 opcoes:['marcaram a chegada dos holandeses a Salvador.','foram vencidas pelos holandeses, que ficaram no Brasil até 1700.','foram vitórias decisivas das tropas luso-brasileiras — que reuniam brancos, negros e indígenas — na luta para expulsar os holandeses.','foram lutas entre bandeirantes e jesuítas no Sul do Brasil.'],
 expl:['Nas duas batalhas, travadas nos Montes Guararapes (perto do Recife) em <b>1648 e 1649</b>, as tropas luso-brasileiras venceram os holandeses.','Lutaram juntos brancos, negros (como Henrique Dias) e indígenas (como Filipe Camarão) — por isso muitos consideram essas batalhas o marco de origem do Exército Brasileiro.','Depois delas, os holandeses foram perdendo força e se renderam em <b>1654</b>.']},
{tema:T3,fonte:LD,tipo:'mc',correta:1,
 enun:'<p>Depois de expulsos do Brasil, os holandeses passaram a produzir açúcar nas Antilhas (Caribe). Qual foi a consequência disso para a colônia portuguesa?</p>',
 opcoes:['O açúcar brasileiro passou a ser o único vendido na Europa.','Os holandeses usaram as técnicas aprendidas no Brasil, gerando concorrência e queda do preço do açúcar brasileiro; Portugal precisou buscar novas riquezas.','Os engenhos brasileiros foram fechados por ordem da Holanda.','O Brasil passou a importar açúcar das Antilhas.'],
 expl:['Os holandeses conheciam bem todo o processo do açúcar e passaram a produzi-lo no Caribe.','Com <b>mais concorrência</b>, o preço do açúcar caiu e a economia açucareira do Brasil entrou em crise.','Isso ajuda a entender por que Portugal incentivou a busca por <b>ouro</b> no interior — o que levou à mineração.']},
{tema:T3,fonte:LD,tipo:'mc',correta:3,
 enun:'<p>Os holandeses não foram os únicos estrangeiros a invadir o Brasil colonial. Qual alternativa descreve corretamente as invasões francesas?</p>',
 opcoes:['Os franceses dominaram Pernambuco entre 1630 e 1654.','Os franceses fundaram a cidade de Salvador em 1624.','Os franceses ocuparam Minas Gerais durante a corrida do ouro.','Os franceses tentaram fundar a França Antártica, no Rio de Janeiro (1555–1567), e a França Equinocial, no Maranhão, onde fundaram São Luís (1612–1615).'],
 expl:['<b>França Antártica</b>: os franceses se instalaram na Baía de Guanabara (Rio de Janeiro) em 1555 e foram expulsos em 1567.','<b>França Equinocial</b>: no Maranhão, fundaram <b>São Luís</b> em 1612 e foram expulsos em 1615.','Pernambuco (1630–1654) foi ocupado pelos <b>holandeses</b>.']},

/* ===================== MINERAÇÃO ===================== */
{tema:T4,fonte:SL,tipo:'mc',correta:0,
 enun:GRAF_POP+'<p class="small" style="text-align:center">Dados: Atlas Histórico do Brasil, FGV/CPDOC (gráfico do material da aula).</p><p>O que o gráfico mostra sobre a época da mineração (século XVIII)?</p>',
 opcoes:['A população da colônia cresceu muito: de cerca de 300 mil (1700) para 3,3 milhões (1800), em grande parte por causa da corrida do ouro.','A população diminuiu, porque muitas pessoas voltaram para Portugal.','A população ficou praticamente igual entre 1700 e 1800.','A população só cresceu no século XVI, antes da mineração.'],
 expl:['Em 1700 havia cerca de <b>300 mil</b> pessoas (sem contar indígenas). Em 1800, eram <b>3,3 milhões</b> — mais de <b>10 vezes</b> mais!','A descoberta do ouro trouxe muitos migrantes de Portugal e de outras capitanias e aumentou muito a chegada de africanos escravizados.','Isso levou à criação de vilas e cidades e ao crescimento da vida urbana.']},
{tema:T4,fonte:SL,tipo:'mc',correta:2,
 enun:'<p>A forma mais comum de extrair ouro em Minas Gerais era a <b>mineração de aluvião</b>. Em que ela consistia?</p>',
 opcoes:['Escavar túneis com máquinas a vapor.','Comprar ouro dos holandeses no Recife.','Retirar o ouro das margens, encostas e leitos dos rios, usando bateias e peneiras.','Derreter moedas espanholas para fazer barras.'],
 expl:['O <b>ouro de aluvião</b> é o ouro levado pelas águas e depositado em <b>rios, margens e encostas</b>.','Era retirado com instrumentos simples, como a <b>bateia</b> (uma espécie de bacia), separando o ouro da areia e do cascalho.','Máquinas a vapor só surgiriam muito depois.']},
{tema:T4,fonte:SL,tipo:'mc',correta:1,
 enun:'<p>O <b>quinto</b> era o principal imposto cobrado sobre o ouro. Quanto ele representava?</p>',
 opcoes:['5% do ouro extraído.','20% do ouro extraído (a quinta parte), que pertencia ao rei.','50% do ouro extraído.','Uma taxa paga apenas pelos escravizados.'],
 expl:['"Quinto" = <b>a quinta parte</b>: 1 de cada 5 partes. 1 ÷ 5 = 0,20 = <b>20%</b>.','A <b>Intendência das Minas</b> era o órgão que fiscalizava a mineração e a cobrança dos impostos.']},
{tema:T4,fonte:PE,tipo:'ab',
 enun:'<p>Se a lei portuguesa determinava que toda riqueza mineral da colônia pertencia ao governo português, por que se permitiu a exploração de tais riquezas por pessoas e entidades particulares?</p>',
 pontos:['Explicou que a Coroa não tinha dinheiro, pessoas nem estrutura para explorar sozinha um território tão grande.','Explicou que a Coroa dividia as áreas em lotes (datas) e concedia aos particulares — quem tinha mais escravizados recebia lotes maiores.','Explicou que, em troca, a Coroa cobrava impostos, principalmente o quinto (20%), fiscalizado pela Intendência das Minas.','Concluiu que assim a Coroa lucrava sem gastar e ainda incentivava a ocupação do interior.'],
 modelo:'Embora as riquezas minerais pertencessem ao rei, a Coroa portuguesa não tinha dinheiro, trabalhadores nem estrutura para explorar sozinha uma região tão grande e distante. Por isso, ela dividia as áreas de ouro em lotes chamados datas e os concedia a particulares — quem tinha mais escravizados recebia lotes maiores. Em troca, os mineradores pagavam impostos, principalmente o quinto (20% do ouro), fiscalizado pela Intendência das Minas. Desse jeito, Portugal lucrava sem ter os custos da exploração e ainda estimulava a ocupação do interior da colônia.'},
{tema:T4,fonte:SL,tipo:'mc',correta:3,
 enun:'<p>Para que serviam as <b>Casas de Fundição</b>?</p>',
 opcoes:['Para fabricar armas para os bandeirantes.','Para produzir açúcar com o calor das fornalhas.','Para guardar os escravizados recém-chegados.','Para transformar o ouro em pó em barras marcadas com o selo real, já descontado o quinto, dificultando o contrabando.'],
 expl:['Todo o ouro em pó deveria ser levado às Casas de Fundição.','Lá era <b>fundido em barras</b>, recebia o <b>selo da Coroa</b> e já tinha o <b>quinto descontado</b>.','Ouro em pó circulando sem selo era considerado contrabando. (O material da escola destaca a lei de 1751, que restabeleceu as Casas de Fundição.)']},
{tema:T4,fonte:SL,tipo:'mc',correta:0,
 enun:'<p>O que era a <b>derrama</b>?</p>',
 opcoes:['Uma cobrança forçada, com confisco de bens da população, quando a região não atingia a cota anual de 100 arrobas de ouro para a Coroa.','Uma festa religiosa realizada nas igrejas barrocas.','O nome dado ao ouro encontrado nos rios.','Um imposto pago apenas pelos holandeses.'],
 expl:['A Coroa exigia que a região das minas pagasse pelo menos <b>100 arrobas de ouro por ano</b> (cerca de 1.500 kg).','Quando essa cota não era alcançada, podia ser decretada a <b>derrama</b>: os bens da população eram confiscados até completar o valor.','A ameaça de uma derrama foi um dos motivos da <b>Inconfidência Mineira</b> (1789), que você vai estudar mais à frente.']},
{tema:T4,fonte:PE,tipo:'ab',
 enun:'<p>Na época da mineração, o interior do Brasil passou a ser explorado. Sendo assim, o <b>Tratado de Tordesilhas</b>, assinado em 1494, precisou ser revisado. Por que a revisão do Tratado de Tordesilhas foi tão importante para Portugal?</p>',
 pontos:['Explicou que bandeiras, missões, pecuária, drogas do sertão e mineração levaram os luso-brasileiros a ocupar terras que, pela linha de Tordesilhas, eram da Espanha.','Explicou que áreas de ouro (como Goiás e Mato Grosso) ficavam a oeste da linha, e Portugal queria garantir essas terras e riquezas.','Citou o Tratado de Madri (1750) e o princípio do <i>uti possidetis</i>: a terra pertence a quem de fato a ocupa.','Concluiu que o território português aumentou muito, ficando próximo do contorno atual do Brasil, e evitou conflitos com a Espanha.'],
 modelo:'Pelo Tratado de Tordesilhas, grande parte do interior da América do Sul pertencia à Espanha. Porém, as bandeiras, as missões, a pecuária, a coleta das drogas do sertão e, principalmente, a mineração levaram os luso-brasileiros a ocupar áreas a oeste da linha — inclusive regiões de ouro em Goiás e Mato Grosso. Portugal precisava garantir legalmente essas terras e suas riquezas. Por isso, em 1750, foi assinado o Tratado de Madri, baseado no princípio do uti possidetis: a terra pertence a quem efetivamente a ocupa. Assim, o território português ficou muito maior, parecido com o contorno atual do Brasil, e evitaram-se conflitos com a Espanha.'},
{tema:T4,fonte:LD,tipo:'mc',correta:2,
 enun:'<p>A <b>Guerra dos Emboabas</b> (1707–1709) foi um conflito na região das minas entre:</p>',
 opcoes:['Holandeses e portugueses, pelo controle do açúcar.','Jesuítas e bandeirantes, pelas missões do Sul.','Paulistas, que descobriram o ouro e queriam o direito exclusivo de explorá-lo, e os "emboabas", forasteiros vindos de Portugal e de outras capitanias.','Escravizados de Palmares e o exército português.'],
 expl:['Os <b>paulistas</b> achavam que, por terem descoberto o ouro, deveriam ter prioridade na exploração.','Os <b>emboabas</b> eram os "de fora": portugueses e moradores de outras regiões, como a Bahia.','Os emboabas venceram; muitos paulistas partiram e acabaram descobrindo ouro em <b>Goiás e Mato Grosso</b>. A Coroa também criou a Capitania de São Paulo e Minas do Ouro (1709) para controlar melhor a região.']},
{tema:T4,fonte:PE,tipo:'ab',
 enun:'<p>A exploração de minerais possibilitou um processo de urbanização nas regiões da atividade mineradora. Contudo, outras atividades foram desenvolvidas, como a agricultura, mas de uma forma diferente da existente nas regiões litorâneas.</p><p>Explique por que essa diferença aconteceu.</p>',
 pontos:['Lembrou que no litoral predominava a plantation: grandes propriedades, monocultura (cana), escravizados e produção para exportar.','Explicou que nas minas havia muita gente concentrada nas vilas que precisava comer (houve fome e preços muito altos no início).','Explicou que a agricultura e a pecuária nas minas eram voltadas para o mercado interno (abastecimento), com produtos variados — policultura (milho, feijão, mandioca, gado...).','Mencionou propriedades geralmente menores (sítios e fazendas) próximas às vilas e aos caminhos, e/ou o comércio com outras regiões (tropeiros).'],
 modelo:'No litoral, a agricultura seguia o modelo da plantation: grandes propriedades com monocultura de cana, mão de obra escravizada e produção para exportação. Na região das minas, a situação era diferente: muitas pessoas chegaram de uma vez e se concentraram nas vilas, e todas precisavam se alimentar. No início faltou comida, houve fome e os preços ficaram altíssimos. Por isso, desenvolveu-se uma agricultura e uma pecuária voltadas para o mercado interno, ou seja, para abastecer a própria população, com vários produtos (policultura), como milho, feijão, mandioca, hortaliças e gado, geralmente em sítios e fazendas menores, perto das vilas e dos caminhos. Também cresceu o comércio com outras regiões, feito pelos tropeiros.'},
{tema:T4,fonte:SL,tipo:'ab',
 enun:'<p>Explique por que os produtos na região das minas eram tão <b>caros (inflacionados)</b>, principalmente no início da mineração.</p>',
 pontos:['Explicou que chegou muita gente de uma vez (corrida do ouro): a procura era muito maior que a oferta.','Explicou que, no início, quase ninguém plantava, pois todos queriam minerar — houve falta de alimentos e fome.','Explicou que os produtos vinham de longe (litoral, São Paulo, Sul, Europa), por caminhos difíceis, em tropas de mulas — transporte caro e demorado.','Mencionou que havia muito ouro circulando e/ou impostos e taxas de passagem, o que também encarecia os produtos.'],

Q.forEach((q,i)=>q.id='h'+(i+1));
const TEMAS=[...new Set(Q.map(q=>q.tema))];
const MINCH=60;

/* ======================= ESTADO ======================= */
const KEY='hist7_treino_v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.r)S={nome:'',r:{},atual:0,filtro:'Todos'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rec(id){return S.r[id]||(S.r[id]={t:0,tent:0,status:'',resps:[]})}
let view='quiz',tStart=null,tick=null;
const cur=()=>Q[S.atual];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdata=s=>s?s.split('-').reverse().join('/'):'';

/* ======================= TEMPO ======================= */
function fmt(s){s=Math.round(s||0);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function flush(){if(tStart){const now=Date.now();rec(cur().id).t+=(now-tStart)/1000;tStart=now;save()}}
function stopTimer(){if(tStart){flush();tStart=null}clearInterval(tick);tick=null;updTimer()}
function startTimer(){stopTimer();if(view!=='quiz'||rec(cur().id).status)return;tStart=Date.now();let c=0;tick=setInterval(()=>{updTimer();if(++c%10===0)flush()},1000);updTimer()}
function elapsed(id){const r=rec(id);return r.t+(tStart&&cur().id===id?(Date.now()-tStart)/1000:0)}
function updTimer(){const el=document.getElementById('timer');if(!el)return;el.textContent='⏱ '+fmt(elapsed(cur().id));el.classList.toggle('stop',!!rec(cur().id).status)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimer();else if(view==='quiz')startTimer()});
window.addEventListener('beforeunload',()=>flush());

/* ======================= CLASSIFICAÇÃO ======================= */
const LET='abcde';
function cor(q,r){ // g y r e ''
  if(!r.status)return'';
  if(q.tipo==='mc')return{ok1:'g',ok:'y',viu:'r'}[r.status];
  if(r.status==='env')return'e';
  return r.nota>=.75?'g':r.nota>=.4?'y':'r';
}
function rotulo(q,r){
  if(!r.status)return r.t>0?'Em andamento':'Não feita';
  if(q.tipo==='mc')return{ok1:'Acertou de primeira',ok:'Acertou após errar',viu:'Viu a explicação'}[r.status];
  if(r.status==='env')return'Enviada (falta autoavaliação)';
  return'Autoavaliação: '+Math.round(r.nota*100)+'%';
}
const CLS={g:'cg',y:'cy',r:'cr',e:'ce','':''};

/* ======================= TELA DE QUESTÕES ======================= */
const app=document.getElementById('app');
function filtradas(){return Q.map((q,i)=>i).filter(i=>S.filtro==='Todos'||(S.filtro==='Abertas'?Q[i].tipo==='ab':Q[i].tema===S.filtro))}

function renderQuiz(){
  const q=cur(),r=rec(q.id),n=S.atual+1;
  const feitas=Q.filter(x=>{const s=rec(x.id).status;return s&&s!=='env'}).length;
  const totalT=Q.reduce((a,x)=>a+elapsed(x.id),0);
  let h=`<div class="card noprint">
   <div class="namebox"><label for="nome"><b>Aluno:</b></label><input id="nome" placeholder="Nome do aluno" value="${esc(S.nome)}">
   <span class="small" style="margin-left:auto">${feitas}/${Q.length} concluídas · tempo total ${fmt(totalT)}</span></div>
   <div class="bar"><i style="width:${feitas/Q.length*100}%"></i></div>
  </div>
  <div class="card noprint"><div class="chips">${['Todos',...TEMAS,'Abertas'].map(t=>`<button class="chip ${S.filtro===t?'on':''}" data-f="${t}">${t==='Abertas'?'✎ Só abertas':t}</button>`).join('')}</div>
   <div class="grid">${filtradas().map(i=>{const qq=Q[i];return`<button class="num ${cor(qq,rec(qq.id))} ${qq.tipo==='ab'?'ab':''} ${i===S.atual?'cur':''}" data-i="${i}" title="${qq.tipo==='ab'?'Questão aberta':'Múltipla escolha'}">${i+1}</button>`}).join('')}</div>
   <div class="legend"><span class="lg">Acertou de 1ª / boa resposta</span><span class="ly">Acertou após errar / parcial</span><span class="lr">Viu explicação / revisar</span><span class="le">Enviada, falta autoavaliar</span><span class="lab">✎ = questão aberta</span></div>
  </div>
  <div class="card">
   <div class="meta"><span class="tag">${q.tema}</span><span class="tipo">${q.tipo==='ab'?'✎ Aberta':'Múltipla escolha'}</span><span class="fonte">${q.fonte}</span><span class="timer" id="timer">⏱ 00:00</span></div>
   <h2>Questão ${n} de ${Q.length}</h2>
   <div class="enun">${q.enun}</div>`;
  if(q.tipo==='mc'){
    h+=`<div class="opts">${q.opcoes.map((o,k)=>`<label class="${r.status&&k===q.correta?'certa':''}"><input type="radio" name="op" value="${k}"><span><b>${LET[k]})</b> ${o}</span></label>`).join('')}</div>
    <div id="fb"></div>
    <div class="actions"><button class="btn p" id="btnResp">Responder</button>
    <button class="btn s" id="btnExp" ${r.tent||r.status?'':'disabled'}>📖 Ver explicação</button></div>
    ${!r.tent&&!r.status?'<div class="hint" id="hintExp">A explicação aparece quando você acertar, ou pode ser aberta depois da primeira tentativa.</div>':''}
    <div id="exp" class="resol" ${r.status?'':'hidden'}><h3>Explicação</h3><ul>${q.expl.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  }else{
    const env=!!r.status;
    h+=`<textarea id="txt" ${env?'readonly':''} placeholder="Escreva sua resposta com suas palavras. Use frases completas e explique o porquê.">${esc(r.texto||'')}</textarea>
    <div class="cont" id="cont"></div>
    <div id="fb"></div>
    ${env?'':`<div class="actions"><button class="btn p" id="btnEnv">Enviar resposta</button></div><div class="hint">Depois de enviar, você verá a resposta-modelo e vai conferir quais pontos importantes incluiu. A resposta enviada não pode mais ser alterada.</div>`}
    ${env?`<div class="resol"><h3>Confira sua resposta</h3>
      <p class="small">Marque <b>com sinceridade</b> os pontos que a sua resposta incluiu. Isso ajuda a acompanhar o que você já sabe.</p>
      <div class="check">${q.pontos.map((p,k)=>`<label><input type="checkbox" data-k="${k}" ${(r.marcados||[]).includes(k)?'checked':''}><span>${p}</span></label>`).join('')}</div>
      <div class="actions"><button class="btn p" id="btnAval">Salvar autoavaliação</button></div>
      <h3 style="margin-top:16px">Resposta-modelo</h3><div class="modelo">${q.modelo}</div>
      <p class="small" style="margin-top:8px">💡 Dica: copie no caderno os pontos que você não marcou. É exatamente isso que costuma faltar na prova.</p></div>`:''}`;
  }
  h+=`<div class="nav"><button class="btn s" id="prev" ${S.atual===0?'disabled':''}>← Anterior</button><button class="btn s" id="next" ${S.atual===Q.length-1?'disabled':''}>Próxima →</button></div></div>`;
  app.innerHTML=h;

  document.getElementById('nome').oninput=e=>{S.nome=e.target.value;save()};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;const f=filtradas();if(!f.includes(S.atual))go(f[0]);else{save();renderQuiz()}});
  app.querySelectorAll('.num').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.getElementById('prev').onclick=()=>go(S.atual-1);
  document.getElementById('next').onclick=()=>go(S.atual+1);
  if(q.tipo==='mc'){
    if(r.status)fbStatus();
    document.getElementById('btnResp').onclick=responderMC;
    document.getElementById('btnExp').onclick=verExp;
  }else{
    const t=document.getElementById('txt'),c=document.getElementById('cont');
    const upd=()=>{const n=t.value.trim().length;c.textContent=r.status?'':(n<MINCH?`${n} caracteres (mínimo ${MINCH})`:`${n} caracteres`)};
    upd();
    if(!r.status){
      t.value=r.rascunho||'';upd();
      t.oninput=()=>{r.rascunho=t.value;save();upd()};
      document.getElementById('btnEnv').onclick=enviarAberta;
    }else{
      fbStatus();
      document.getElementById('btnAval').onclick=salvarAval;
    }
  }
  startTimer();
}
function fb(msg,cls){document.getElementById('fb').innerHTML=`<div class="fb ${cls}">${msg}</div>`}
function fbStatus(){
  const q=cur(),r=rec(q.id);
  if(q.tipo==='mc'){
    if(r.status==='ok1')fb(`✔ Você acertou de primeira em ${fmt(r.t)}.`,'ok');
    else if(r.status==='ok')fb(`✔ Você acertou após ${r.tent} tentativas, em ${fmt(r.t)}.`,'info');
    else fb(`Você abriu a explicação (${r.tent} tentativa${r.tent>1?'s':''}, ${fmt(r.t)}). A alternativa correta está destacada em verde.`,'info');
  }else{
    if(r.status==='env')fb(`Resposta enviada em ${fmt(r.t)}. Agora confira os pontos abaixo e salve sua autoavaliação.`,'info');
    else{const p=Math.round(r.nota*100);fb(`Autoavaliação salva: ${p}% dos pontos importantes (${(r.marcados||[]).length} de ${q.pontos.length}). Tempo: ${fmt(r.t)}.`,r.nota>=.75?'ok':r.nota>=.4?'info':'bad')}
  }
}
function responderMC(){
  const q=cur(),r=rec(q.id);
  const c=app.querySelector('input[name=op]:checked');if(!c){fb('Escolha uma alternativa.','info');return}
  const k=+c.value,ok=k===q.correta;
  if(r.status){fb(ok?'✔ Correto! (o registro desta questão foi mantido)':'✘ Não é essa. A correta está destacada em verde.',ok?'ok':'bad');return}
  flush();r.tent++;r.resps.push(LET[k]+')');
  if(ok){r.status=r.tent===1?'ok1':'ok';r.quando=hoje();stopTimer();save();renderQuiz();document.getElementById('exp').scrollIntoView({behavior:'smooth',block:'nearest'})}
  else{save();fb(`✘ Ainda não. Releia o enunciado e tente de novo, ou veja a explicação. (tentativa ${r.tent})`,'bad');
    document.getElementById('btnExp').disabled=false;const hn=document.getElementById('hintExp');if(hn)hn.remove()}
}
function verExp(){
  const r=rec(cur().id);
  if(!r.status){flush();r.status='viu';r.quando=hoje();stopTimer();save();renderQuiz()}
  document.getElementById('exp').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function enviarAberta(){
  const r=rec(cur().id),t=document.getElementById('txt').value.trim();
  if(t.length<MINCH){fb(`Sua resposta está muito curta. Escreva pelo menos ${MINCH} caracteres (umas duas frases), explicando com suas palavras.`,'info');return}
  if(!confirm('Enviar a resposta? Depois de enviada ela não poderá ser alterada.'))return;
  flush();r.texto=t;delete r.rascunho;r.tent=1;r.status='env';r.quando=hoje();stopTimer();save();renderQuiz();
  app.querySelector('.resol').scrollIntoView({behavior:'smooth',block:'start'});
}
function salvarAval(){
  const q=cur(),r=rec(q.id);
  r.marcados=[...app.querySelectorAll('.check input:checked')].map(i=>+i.dataset.k);
  r.nota=r.marcados.length/q.pontos.length;r.status='ab';save();renderQuiz();
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'center'});
}
function go(i){if(i<0||i>=Q.length)return;stopTimer();S.atual=i;save();renderQuiz();window.scrollTo({top:0,behavior:'smooth'})}

/* ======================= ACOMPANHAMENTO ======================= */
const AVP={'':'—',boa:'Boa',parcial:'Parcial',refazer:'Refazer'};
function calc(lista){
  const mc=lista.filter(x=>x.q.tipo==='mc'&&x.r.status),ab=lista.filter(x=>x.q.tipo==='ab'&&x.r.status==='ab');
  const ok1=mc.filter(x=>x.r.status==='ok1').length;
  const feitas=lista.filter(x=>x.r.status&&x.r.status!=='env');
  return{mc,ab,ok1,feitas,
    pmc:mc.length?Math.round(ok1/mc.length*100):null,
    pab:ab.length?Math.round(ab.reduce((a,x)=>a+x.r.nota,0)/ab.length*100):null,
    tmc:mc.length?mc.reduce((a,x)=>a+x.r.t,0)/mc.length:null,
    tab:ab.length?ab.reduce((a,x)=>a+x.r.t,0)/ab.length:null,
    tot:lista.reduce((a,x)=>a+x.r.t,0)};
}
const pct=v=>v==null?'–':v+'%';
const pc=v=>v==null?'':v>=75?'cg':v>=40?'cy':'cr';
function revisar(rs){return rs.filter(x=>x.r.status&&(x.r.status==='viu'||x.r.status==='ok'||(x.q.tipo==='ab'&&x.r.status==='ab'&&x.r.nota<.5)||x.r.pai==='refazer'))}

  const rs=Q.map((q,i)=>({q,i,r:rec(q.id)}));
  const G=calc(rs),pend=rs.filter(x=>x.r.status==='env');

  const rev=revisar(rs);
  let h=`<div class="card"><h2>Acompanhamento${S.nome?' – '+esc(S.nome):''}</h2><p class="small">Gerado em ${new Date().toLocaleString('pt-BR')}</p>
  <div class="stats">
   <div class="stat"><span class="small">Concluídas</span><b>${G.feitas.length}/${Q.length}</b></div>
   <div class="stat"><span class="small">Múltipla escolha: acerto de 1ª</span><b class="${pc(G.pmc)}">${pct(G.pmc)}</b><span class="small">${G.ok1} de ${G.mc.length} feitas</span></div>
   <div class="stat"><span class="small">Abertas: média da autoavaliação</span><b class="${pc(G.pab)}">${pct(G.pab)}</b><span class="small">${G.ab.length} avaliadas${pend.length?` · ${pend.length} pendente(s)`:''}</span></div>
   <div class="stat"><span class="small">Tempo total</span><b>${fmt(G.tot)}</b></div>
   <div class="stat"><span class="small">Tempo médio · múltipla escolha</span><b>${G.tmc==null?'–':fmt(G.tmc)}</b></div>
   <div class="stat"><span class="small">Tempo médio · aberta</span><b>${G.tab==null?'–':fmt(G.tab)}</b></div>
  </div>

  <h3>Por assunto</h3><div class="tw"><table><tr><th>Assunto</th><th>Concluídas</th><th>Múlt. escolha (acerto de 1ª)</th><th>Abertas (autoavaliação)</th><th>Tempo total</th></tr>
  ${TEMAS.map(t=>{const g=rs.filter(x=>x.q.tema===t),c=calc(g);return`<tr><td>${t}</td><td>${c.feitas.length}/${g.length}</td><td class="${pc(c.pmc)}">${pct(c.pmc)}</td><td class="${pc(c.pab)}">${pct(c.pab)}</td><td>${fmt(c.tot)}</td></tr>`}).join('')}
  </table></div>

  <h3>Evolução por dia</h3>${Object.keys(dias).length?`<div class="tw"><table><tr><th>Dia</th><th>Questões concluídas</th><th>Múlt. escolha (acerto de 1ª)</th><th>Abertas (autoavaliação)</th><th>Tempo</th></tr>
  ${Object.keys(dias).sort().map(d=>{const c=calc(dias[d]);return`<tr><td>${fdata(d)}</td><td>${dias[d].length}</td><td class="${pc(c.pmc)}">${pct(c.pmc)}</td><td class="${pc(c.pab)}">${pct(c.pab)}</td><td>${fmt(c.tot)}</td></tr>`}).join('')}</table></div>`:'<p class="small">Ainda não há questões concluídas.</p>'}

  <h3>Para revisar</h3>${rev.length?`<p class="small">Questões em que ele errou antes de acertar, abriu a explicação, marcou menos da metade dos pontos ou que o responsável marcou como "Refazer".</p><ul>${rev.map(x=>`<li><a href="#" data-go="${x.i}">Questão ${x.i+1}</a> – ${x.q.tema}: <span class="${CLS[cor(x.q,x.r)]}">${rotulo(x.q,x.r)}</span>${x.r.pai==='refazer'?' · <b class="cr">Responsável: refazer</b>':''}</li>`).join('')}</ul>`:'<p class="small">Nada para revisar por enquanto. 👏</p>'}

  <h3>Respostas abertas</h3><p class="small">Leia o que ele escreveu, veja os pontos que faltaram e, se quiser, registre a sua avaliação.</p>
  ${rs.filter(x=>x.q.tipo==='ab').map(x=>{
    if(!x.r.status)return`<div class="abcard"><b>Questão ${x.i+1}</b> – <span class="small">${x.q.tema}</span> · <span class="small">${x.r.rascunho?'Rascunho iniciado, ainda não enviada':'Não respondida'}</span></div>`;
    const falt=x.r.status==='ab'?x.q.pontos.filter((p,k)=>!(x.r.marcados||[]).includes(k)):[];
    return`<div class="abcard"><b>Questão ${x.i+1}</b> – <span class="small">${x.q.tema} · ${fdata(x.r.quando)} · tempo ${fmt(x.r.t)}</span>
     <div class="small" style="margin-top:4px">${strip(x.q.enun).replace(/\s+/g,' ').slice(-220).replace(/^\S*\s/,'… ')}</div>
     <div class="txt">${esc(x.r.texto)}</div>
     <div><span class="${CLS[cor(x.q,x.r)]}">${rotulo(x.q,x.r)}</span></div>
     ${falt.length?`<div class="falta">Pontos que ele não marcou:<ul>${falt.map(p=>`<li>${p}</li>`).join('')}</ul></div>`:''}
     <div class="noprint" style="margin-top:6px"><label class="small">Avaliação do responsável: <select data-pai="${x.q.id}">${Object.keys(AVP).map(k=>`<option value="${k}" ${(x.r.pai||'')===k?'selected':''}>${AVP[k]}</option>`).join('')}</select></label></div>
     ${x.r.pai?`<div class="small only-print">Avaliação do responsável: ${AVP[x.r.pai]}</div>`:''}
    </div>`}).join('')}

  <h3>Questão por questão</h3><div class="tw"><table><tr><th>Nº</th><th>Assunto</th><th>Tipo</th><th>Situação</th><th>Tentativas</th><th>Tempo</th><th>Dia</th><th>Respostas (m. escolha)</th></tr>
  ${rs.map(x=>`<tr><td>${x.i+1}</td><td>${x.q.tema}</td><td>${x.q.tipo==='ab'?'Aberta':'M. escolha'}</td><td class="${CLS[cor(x.q,x.r)]}">${rotulo(x.q,x.r)}</td><td>${x.r.tent||'–'}</td><td>${x.r.t>0?fmt(x.r.t):'–'}</td><td>${fdata(x.r.quando)||'–'}</td><td>${x.q.tipo==='mc'?((x.r.resps||[]).join(' · ')||'–'):'–'}</td></tr>`).join('')}
  </table></div>

  <div class="actions noprint"><button class="btn w" id="wpp">📲 Enviar resumo pelo WhatsApp</button><button class="btn p" id="csv">⬇ Baixar planilha (CSV)</button><button class="btn s" id="imp">🖨 Imprimir</button><button class="btn d" id="zera">Apagar todo o progresso</button></div>
  </div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();S.filtro='Todos';S.atual=+a.dataset.go;setView('quiz')});
  app.querySelectorAll('[data-pai]').forEach(s=>s.onchange=()=>{const r=S.r[s.dataset.pai];r.pai=s.value;save();renderRel()});
  document.getElementById('imp').onclick=()=>window.print();
  document.getElementById('wpp').onclick=()=>{
    let t=`📜 História 7º ano – Brasil Colônia${S.nome?'\nAluno: '+S.nome:''}\nData: ${new Date().toLocaleDateString('pt-BR')}\n\nConcluídas: ${G.feitas.length}/${Q.length}\nMúltipla escolha (acerto de 1ª): ${pct(G.pmc)}\nAbertas (autoavaliação): ${pct(G.pab)}\nTempo total: ${fmt(G.tot)}\n\nPor assunto:\n`;
    TEMAS.forEach(tm=>{const g=rs.filter(x=>x.q.tema===tm),c=calc(g);t+=`• ${tm}: ${c.feitas.length}/${g.length} · m.e. ${pct(c.pmc)} · abertas ${pct(c.pab)}\n`});
    if(rev.length)t+=`\nPara revisar: questões ${rev.map(x=>x.i+1).join(', ')}`;
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
  };
  document.getElementById('csv').onclick=()=>{
    const L=[['Questao','Assunto','Tipo','Situacao','Tentativas','Tempo (s)','Tempo (mm:ss)','Dia','Respostas m.e.','Nota autoavaliacao (%)','Avaliacao responsavel','Resposta aberta']];
    rs.forEach(x=>L.push([x.i+1,x.q.tema,x.q.tipo==='ab'?'Aberta':'Multipla escolha',rotulo(x.q,x.r),x.r.tent||0,Math.round(x.r.t),fmt(x.r.t),fdata(x.r.quando),(x.r.resps||[]).join(' | '),x.r.status==='ab'?Math.round(x.r.nota*100):'',AVP[x.r.pai||''].replace('—',''),x.r.texto||'']));
    const csv='﻿'+L.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='acompanhamento_historia_'+(S.nome||'aluno').replace(/\s+/g,'_')+'.csv';a.click();
  };
  document.getElementById('zera').onclick=()=>{if(confirm('Apagar todas as respostas, tempos e avaliações? Isso não pode ser desfeito.')){const n=S.nome;S={nome:n,r:{},atual:0,filtro:'Todos'};save();renderRel()}};
}
function setView(v){view=v;document.getElementById('tabQ').classList.toggle('on',v==='quiz');document.getElementById('tabR').classList.toggle('on',v==='rel');
  if(v==='quiz')renderQuiz();else renderRel();window.scrollTo(0,0)}
document.getElementById('tabQ').onclick=()=>setView('quiz');
document.getElementById('tabR').onclick=()=>setView('rel');
if(S.atual>=Q.length)S.atual=0;
setView('quiz');
</script>
</body>
</html>
