<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matemática 7º ano – Treino</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e2e5ee;
  --pri:#2f5bea;--pri2:#e9eefe;--ok:#178a50;--okbg:#e4f5ec;--warn:#a87200;--warnbg:#fff4d4;
  --bad:#cc3d3d;--badbg:#fde9e9;--fig:#a8d8b9;--figline:#2e9e5e;--shade:#f6b26b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
.hwrap{max-width:980px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header nav button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
header nav button.on{background:#fff;color:var(--pri);font-weight:600}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.small{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.num{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px}
.num.cur{outline:3px solid var(--pri);outline-offset:1px}
.num.ok1{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.num.ok{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.num.viu{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l1::before{background:var(--okbg);border-color:var(--ok)}
.legend .l2::before{background:var(--warnbg);border-color:var(--warn)}
.legend .l3::before{background:var(--badbg);border-color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.tag{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--pri2);color:var(--pri);font-weight:600}
.fonte{font-size:12px;color:var(--muted)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;background:#f0f2f7;border-radius:8px;padding:3px 10px}
.timer.stop{color:var(--muted)}
h2{font-size:19px;margin:6px 0 10px}
.enun p{margin:0 0 10px}
.enun svg{display:block;max-width:100%;height:auto;margin:8px auto 12px}
.resp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.resp input[type=text]{font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;width:200px}
.resp input[type=text]:focus{border-color:var(--pri);outline:none}
.unid{font-weight:600;color:var(--muted)}
.opts{display:grid;gap:8px;margin-top:10px}
.opts label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--pri);background:var(--pri2)}
.opts input{margin-top:5px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.p{background:var(--pri);color:#fff}
.btn.s{background:#eef1f7;color:var(--ink)}
.btn.d{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.info{background:var(--warnbg);color:var(--warn)}
.resol{margin-top:14px;border-left:4px solid var(--pri);background:#f8f9fd;border-radius:0 10px 10px 0;padding:10px 16px}
.resol h3{margin:4px 0 6px;font-size:16px;color:var(--pri)}
.resol ol{margin:0;padding-left:22px}
.resol li{margin:4px 0}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#f8f9fd;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f3f5fa;font-size:13px}
.tw{overflow-x:auto}
.st-ok1{color:var(--ok);font-weight:600}.st-ok{color:var(--warn);font-weight:600}.st-viu{color:var(--bad);font-weight:600}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
code{background:#eef1f7;padding:1px 5px;border-radius:5px}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>📐 Matemática 7º ano</h1>
  <nav><button id="tabQ" class="on">Exercícios</button> <button id="tabR">Relatório</button></nav>
</div></header>
<main id="app"></main>

<script>
/* ======================= FIGURAS ======================= */
const FIG = {
rect9: `<svg viewBox="0 0 340 160" width="340"><g fill="var(--fig)" stroke="var(--figline)" stroke-width="2">
${[0,1,2,3,4].map(i=>`<rect x="${10+i*64}" y="8" width="64" height="80"/>`).join('')}
${[0,1,2,3].map(i=>`<rect x="${10+i*80}" y="88" width="80" height="64"/>`).join('')}</g></svg>`,
L: `<svg viewBox="0 0 280 210" width="280"><path d="M40 20 H120 V120 H240 V180 H40 Z" fill="var(--fig)" stroke="var(--figline)" stroke-width="2"/>
<g font-size="14" fill="currentColor" text-anchor="middle"><text x="80" y="14">4 cm</text><text x="140" y="200">10 cm</text>
<text x="20" y="104" transform="rotate(-90 20 100)">8 cm</text><text x="262" y="154">3 cm</text></g></svg>`,
quadTri: `<svg viewBox="0 0 220 210" width="220"><rect x="30" y="20" width="160" height="160" fill="#fff" stroke="var(--figline)" stroke-width="2"/>
<path d="M30 180 L190 180 L130 20 Z" fill="var(--shade)" stroke="#b86b1c" stroke-width="2"/>
<g font-size="14" fill="currentColor"><text x="14" y="196">A</text><text x="194" y="196">B</text><text x="194" y="16">C</text><text x="14" y="16">D</text><text x="126" y="14">P</text>
<text x="110" y="202" text-anchor="middle">8 cm</text></g></svg>`,
moldura: `<svg viewBox="0 0 240 180" width="240"><rect x="30" y="20" width="180" height="120" fill="var(--shade)" stroke="#b86b1c" stroke-width="2"/>
<rect x="90" y="50" width="60" height="60" fill="#fff" stroke="#b86b1c" stroke-width="2"/>
<g font-size="14" fill="currentColor" text-anchor="middle"><text x="120" y="160">12 cm</text><text x="14" y="84" transform="rotate(-90 14 80)">8 cm</text><text x="120" y="84">4 cm</text></g></svg>`,
malha: (()=>{let g='';for(let i=0;i<=8;i++)g+=`<line x1="${20+30*i}" y1="20" x2="${20+30*i}" y2="170" stroke="#cfd5e3"/>`;for(let j=0;j<=5;j++)g+=`<line x1="20" y1="${20+30*j}" x2="260" y2="${20+30*j}" stroke="#cfd5e3"/>`;
return `<svg viewBox="0 0 280 190" width="280">${g}<path d="M20 170 L200 170 L80 50 Z" fill="var(--fig)" fill-opacity=".85" stroke="var(--figline)" stroke-width="2.5"/></svg>`})()
};

/* ======================= QUESTÕES ======================= */
const T_U='Unidades de medida', T_A='Áreas', T_D='Composição e decomposição', T_V='Volume', T_P='Probabilidade';
const AP='Apostila da escola', LD='Modelo: livro didático', OL='Modelo: olimpíada (OBMEP)';

const Q = [
/* ---------- UNIDADES ---------- */
{tema:T_U,fonte:AP,tipo:'num',resp:0.2,unid:'m',
 enun:'<p>Converta <b>20 centímetros</b> em metros.</p>',
 resol:['Lembre: 1 m = 100 cm.','Para passar de cm para m, dividimos por 100.','20 ÷ 100 = 0,2','<b>Resposta: 0,2 m</b>']},
{tema:T_U,fonte:AP,tipo:'num',resp:0.2,unid:'km',
 enun:'<p>Converta <b>200 metros</b> em quilômetros.</p>',
 resol:['Lembre: 1 km = 1 000 m.','Para passar de m para km, dividimos por 1 000.','200 ÷ 1 000 = 0,2','<b>Resposta: 0,2 km</b>']},
{tema:T_U,fonte:AP,tipo:'num',resp:1300,unid:'dm',
 enun:'<p>Converta <b>13 decâmetros</b> em decímetros.</p>',
 resol:['Use a tabela: km – hm – <b>dam</b> – m – <b>dm</b> – cm – mm.','De dam até dm andamos 2 casas para a direita. Cada casa para a direita multiplica por 10.','Então multiplicamos por 10 × 10 = 100.','13 × 100 = 1 300','<b>Resposta: 1 300 dm</b>']},
{tema:T_U,fonte:AP,tipo:'num',resp:50000,unid:'cm',
 enun:'<p>Converta <b>5 hectômetros</b> em centímetros.</p>',
 resol:['Tabela: km – <b>hm</b> – dam – m – dm – <b>cm</b> – mm.','De hm até cm são 4 casas para a direita: multiplicamos por 10 000.','5 × 10 000 = 50 000','Conferindo: 5 hm = 500 m = 50 000 cm.','<b>Resposta: 50 000 cm</b>']},
{tema:T_U,fonte:LD,tipo:'num',resp:35000,unid:'cm²',
 enun:'<p>Converta <b>3,5 m²</b> em cm².</p>',
 resol:['Atenção: em medidas de <b>área</b>, cada casa da tabela vale ×100 (e não ×10).','1 m² = 100 cm × 100 cm = 10 000 cm².','3,5 × 10 000 = 35 000','<b>Resposta: 35 000 cm²</b>']},
{tema:T_U,fonte:LD,tipo:'num',resp:2.5,unid:'m²',
 enun:'<p>Uma cartolina tem <b>25 000 cm²</b> de área. Quanto é isso em m²?</p>',
 resol:['1 m² = 10 000 cm².','De cm² para m² dividimos por 10 000.','25 000 ÷ 10 000 = 2,5','<b>Resposta: 2,5 m²</b>']},
{tema:T_U,fonte:LD,tipo:'num',resp:2000,unid:'dm³',
 enun:'<p>Converta <b>2 m³</b> em dm³.</p>',
 resol:['Em medidas de <b>volume</b>, cada casa da tabela vale ×1 000.','1 m³ = 10 dm × 10 dm × 10 dm = 1 000 dm³.','2 × 1 000 = 2 000','<b>Resposta: 2 000 dm³</b>']},
{tema:T_U,fonte:LD,tipo:'num',resp:4.5,unid:'litros',
 enun:'<p>Uma garrafa tem capacidade de <b>4 500 cm³</b>. Quantos litros cabem nela?</p>',
 resol:['Relação importante: 1 dm³ = 1 litro = 1 000 cm³.','Então 1 L = 1 000 cm³.','4 500 ÷ 1 000 = 4,5','<b>Resposta: 4,5 litros</b>']},
{tema:T_U,fonte:LD,tipo:'num',resp:36000,unid:'litros',
 enun:'<p>Uma piscina contém <b>36 m³</b> de água. Quantos litros de água há na piscina?</p>',
 resol:['1 m³ = 1 000 dm³ e 1 dm³ = 1 litro.','Logo, 1 m³ = 1 000 litros.','36 × 1 000 = 36 000','<b>Resposta: 36 000 litros</b>']},
{tema:T_U,fonte:'BNCC – medidas aproximadas',tipo:'mc',correta:1,
 enun:'<p>Três alunos mediram o comprimento da <b>mesma</b> carteira, cada um com sua régua, e obtiveram: 59,8 cm, 60,1 cm e 60 cm. O que melhor explica essa diferença?</p>',
 opcoes:['Dois alunos erraram a leitura, só um está certo.','Toda medida feita com instrumentos é aproximada; pequenas diferenças são normais.','A carteira mudou de tamanho entre uma medição e outra.','Só se pode medir carteiras com fita métrica.'],
 resol:['Quando medimos algo de verdade (medida empírica), sempre há pequenas imprecisões: a régua, a posição do olho, o alinhamento.','Por isso, toda medida é <b>aproximada</b>. Valores muito próximos, como 59,8 / 60 / 60,1 cm, são todos aceitáveis.','<b>Resposta: alternativa b</b>']},

/* ---------- ÁREAS ---------- */
{tema:T_A,fonte:LD,tipo:'num',resp:90,unid:'cm²',
 enun:'<p>Calcule a área de um retângulo de <b>12 cm</b> de comprimento por <b>7,5 cm</b> de largura.</p>',
 resol:['Área do retângulo: A = comprimento × largura.','A = 12 × 7,5','12 × 7 = 84 e 12 × 0,5 = 6 → 84 + 6 = 90','<b>Resposta: 90 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:81,unid:'cm²',
 enun:'<p>Um quadrado tem <b>perímetro de 36 cm</b>. Qual é a sua área?</p>',
 resol:['O quadrado tem 4 lados iguais. Lado = 36 ÷ 4 = 9 cm.','Área do quadrado: A = lado × lado.','A = 9 × 9 = 81','<b>Resposta: 81 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:120,unid:'cm²',
 enun:'<p>Um paralelogramo tem <b>base de 15 cm</b>, lado inclinado de 10 cm e <b>altura de 8 cm</b>. Qual é a sua área?</p>',
 resol:['Área do paralelogramo: A = base × altura.','Cuidado: a altura é a distância <b>perpendicular</b> (reta, 90°) entre as bases. O lado inclinado (10 cm) não entra na conta!','A = 15 × 8 = 120','<b>Resposta: 120 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:63,unid:'cm²',
 enun:'<p>Calcule a área de um triângulo com <b>base de 14 cm</b> e <b>altura de 9 cm</b>.</p>',
 resol:['Um triângulo é metade de um paralelogramo de mesma base e altura.','Por isso: A = (base × altura) ÷ 2.','A = (14 × 9) ÷ 2 = 126 ÷ 2 = 63','<b>Resposta: 63 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:40,unid:'cm²',
 enun:'<p>Um trapézio tem <b>base maior de 10 cm</b>, <b>base menor de 6 cm</b> e <b>altura de 5 cm</b>. Qual é a sua área?</p>',
 resol:['Área do trapézio: A = (base maior + base menor) × altura ÷ 2.','A = (10 + 6) × 5 ÷ 2','A = 16 × 5 ÷ 2 = 80 ÷ 2 = 40','<b>Resposta: 40 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:48,unid:'cm²',
 enun:'<p>Um losango tem <b>diagonais de 12 cm e 8 cm</b>. Qual é a sua área?</p>',
 resol:['Área do losango: A = (diagonal maior × diagonal menor) ÷ 2.','Por quê? O losango ocupa metade do retângulo formado pelas diagonais.','A = (12 × 8) ÷ 2 = 96 ÷ 2 = 48','<b>Resposta: 48 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:24,unid:'cm²',
 enun:'<p>Um triângulo retângulo tem lados de <b>6 cm, 8 cm e 10 cm</b>. Os lados de 6 cm e 8 cm formam o ângulo reto. Qual é a área desse triângulo?</p>',
 resol:['No triângulo retângulo, os dois lados que formam o ângulo reto (catetos) servem como base e altura.','O lado de 10 cm (o maior) não é usado.','A = (6 × 8) ÷ 2 = 48 ÷ 2 = 24','<b>Resposta: 24 cm²</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:5400,unid:'reais',
 enun:'<p>Um terreno retangular mede <b>25 m por 18 m</b>. O metro quadrado de grama custa <b>R$ 12,00</b>. Quanto se gastará para gramar todo o terreno?</p>',
 resol:['Primeiro a área: A = 25 × 18 = 450 m².','Depois o custo: 450 × 12.','450 × 12 = 450 × 10 + 450 × 2 = 4 500 + 900 = 5 400','<b>Resposta: R$ 5 400,00</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:40,unid:'cm',
 enun:'<p>Um retângulo tem <b>área de 96 cm²</b> e <b>comprimento de 12 cm</b>. Qual é o seu <b>perímetro</b>?</p>',
 resol:['Área = comprimento × largura → 96 = 12 × largura.','Largura = 96 ÷ 12 = 8 cm.','Perímetro = soma dos 4 lados = 12 + 8 + 12 + 8 = 40.','<b>Resposta: 40 cm</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:56,unid:'peças',
 enun:'<p>O piso de uma sala retangular de <b>4 m por 3,5 m</b> será coberto com peças de cerâmica <b>quadradas de 50 cm de lado</b>. Quantas peças serão necessárias (sem perdas)?</p>',
 resol:['Coloque tudo na mesma unidade: 50 cm = 0,5 m.','Área da sala: 4 × 3,5 = 14 m². Área de uma peça: 0,5 × 0,5 = 0,25 m².','Número de peças: 14 ÷ 0,25 = 56.','Outra forma: no comprimento cabem 4 ÷ 0,5 = 8 peças; na largura 3,5 ÷ 0,5 = 7 peças; 8 × 7 = 56.','<b>Resposta: 56 peças</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:5,unid:'cm',
 enun:'<p>Um triângulo tem <b>área de 30 cm²</b> e <b>base de 12 cm</b>. Qual é a sua altura?</p>',
 resol:['A = (base × altura) ÷ 2 → 30 = (12 × altura) ÷ 2.','12 ÷ 2 = 6, então 30 = 6 × altura.','Altura = 30 ÷ 6 = 5.','<b>Resposta: 5 cm</b>']},
{tema:T_A,fonte:LD,tipo:'num',resp:10,unid:'hectares',
 enun:'<p>Um sítio retangular mede <b>400 m por 250 m</b>. Sabendo que <b>1 hectare = 10 000 m²</b>, qual é a área do sítio em hectares?</p>',
 resol:['Área em m²: 400 × 250 = 100 000 m².','Em hectares: 100 000 ÷ 10 000 = 10.','<b>Resposta: 10 hectares</b>']},
{tema:T_A,fonte:LD,tipo:'mc',correta:1,
 enun:'<p>Se dobrarmos a medida do lado de um quadrado, o que acontece com a sua área?</p>',
 opcoes:['Também dobra (fica 2 vezes maior).','Fica 4 vezes maior.','Fica 6 vezes maior.','Fica 8 vezes maior.'],
 resol:['Teste com um exemplo: lado 3 → área 3 × 3 = 9.','Dobrando o lado: lado 6 → área 6 × 6 = 36.','36 ÷ 9 = 4. A área ficou 4 vezes maior (2 × 2 = 4).','<b>Resposta: alternativa b</b>']},

/* ---------- COMPOSIÇÃO E DECOMPOSIÇÃO ---------- */
{tema:T_D,fonte:AP+' / '+OL,tipo:'mc',correta:3,
 enun:'<p>A figura mostra um retângulo de <b>área 720 cm²</b>, formado por <b>9 retângulos menores e iguais</b>.</p>'+FIG.rect9+'<p>Qual é o perímetro, em centímetros, de um dos retângulos menores?</p>',
 opcoes:['24 cm','28 cm','32 cm','36 cm','40 cm'],
 resol:['Área de cada retângulo menor: 720 ÷ 9 = 80 cm².','Chame o lado menor de <b>a</b> e o maior de <b>b</b>. Em cima há 5 retângulos "em pé" (largura a) e embaixo 4 "deitados" (largura b). As duas fileiras têm o mesmo comprimento: <b>5 × a = 4 × b</b>.','Procure dois números com a × b = 80 e 5a = 4b. Testando: a = 8 e b = 10 → 8 × 10 = 80 ✔ e 5 × 8 = 40 = 4 × 10 ✔.','Perímetro de um retângulo menor: 2 × (8 + 10) = 2 × 18 = 36.','<b>Resposta: 36 cm (alternativa d)</b>']},
{tema:T_D,fonte:LD,tipo:'num',resp:50,unid:'cm²',
 enun:'<p>Calcule a área da figura abaixo (todos os ângulos são retos).</p>'+FIG.L,
 resol:['Divida a figura em dois retângulos.','Retângulo da esquerda (em pé): 4 × 8 = 32 cm².','Retângulo da direita (deitado): largura 10 − 4 = 6 cm e altura 3 cm → 6 × 3 = 18 cm².','Total: 32 + 18 = 50 cm².','Outra forma: retângulo inteiro 10 × 8 = 80, menos o "pedaço que falta" 6 × 5 = 30 → 80 − 30 = 50.','<b>Resposta: 50 cm²</b>']},
{tema:T_D,fonte:LD,tipo:'num',resp:32,unid:'cm²',
 enun:'<p>ABCD é um quadrado de lado <b>8 cm</b>. O ponto P está em qualquer posição do lado CD. Qual é a área do triângulo ABP (em laranja)?</p>'+FIG.quadTri,
 resol:['A base do triângulo é AB = 8 cm.','A altura é a distância de P até AB, que é o próprio lado do quadrado: 8 cm (não importa onde P esteja em CD!).','A = (8 × 8) ÷ 2 = 64 ÷ 2 = 32.','Repare: o triângulo ocupa sempre <b>metade</b> do quadrado.','<b>Resposta: 32 cm²</b>']},
{tema:T_D,fonte:LD,tipo:'num',resp:80,unid:'cm²',
 enun:'<p>De uma placa retangular de <b>12 cm por 8 cm</b> foi recortado um quadrado de <b>4 cm de lado</b>. Qual é a área da parte que sobrou (em laranja)?</p>'+FIG.moldura,
 resol:['Área da placa inteira: 12 × 8 = 96 cm².','Área do quadrado recortado: 4 × 4 = 16 cm².','Área que sobrou: 96 − 16 = 80.','<b>Resposta: 80 cm²</b>']},

function parseNum(s){
  s=String(s).trim().toLowerCase();
  const pct=s.includes('%');
  s=s.replace(/[a-zà-ü$]+\s*[²³23]?/g,'').replace(/[²³%\s]/g,'');
  const conv=t=>{if(!t)return NaN;
    if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');
    else if(t.includes(','))t=t.replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
    return /^-?\d*\.?\d+$/.test(t)?Number(t):NaN};
  let v;
  if(s.includes('/')){const p=s.split('/');if(p.length!==2)return NaN;v=conv(p[0])/conv(p[1])}else v=conv(s);
  return pct?v/100:v;
}
function confere(q,txt){
  if(q.tipo==='mc')return Number(txt)===q.correta;
  const v=parseNum(txt);if(!isFinite(v))return null;
  const tol=q.prob?0.007:Math.max(1e-9,Math.abs(q.resp)*1e-9);
  return Math.abs(v-q.resp)<=tol;
}

function showFb(msg,cls){

  }
  if(msg)fb.innerHTML=`<div class="fb ${cls}">${msg}</div>`;

function responder(){
  const q=cur(),r=rec(q.id);let txt;

  else{txt=document.getElementById('ans').value;if(!txt.trim()){showFb('Digite sua resposta.','info');return}}
  const ok=confere(q,txt);
  if(ok===null){showFb('Não entendi o número. Exemplos: 2,5 · 1300 · 3/8 · 40%','info');return}
  const shown=q.tipo==='mc'?LET[+txt]+')':txt.trim();
  if(r.status){ // já concluída: só confere, sem mudar o registro
    showFb(ok?'✔ Correto! (questão já estava concluída, registro mantido)':'✘ Ainda não está certo. Confira a resolução.',ok?'ok':'bad');return}
  flush();r.tent++;r.resps.push(shown);
  if(ok){r.status=r.tent===1?'ok1':'ok';stopTimer();save();renderQuiz();
    const bt=document.getElementById('btnResol');bt.disabled=false;
  }else{save();showFb(`✘ Ainda não. Confira suas contas no papel e tente de novo, ou veja a resolução. (tentativa ${r.tent})`,'bad');
    document.getElementById('btnResol').disabled=false;const h=app.querySelector('.actions + .hint');if(h)h.remove();}
}
function verResol(){
  const r=rec(cur().id);
  if(!r.status){flush();r.status='viu';stopTimer();save();renderQuiz()}
  const el=document.getElementById('resol');el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function go(i){if(i<0||i>=Q.length)return;stopTimer();S.atual=i;save();renderQuiz();window.scrollTo({top:0,behavior:'smooth'})}

function renderRel(){
  stopTimer();
  const rs=Q.map(q=>({q,r:rec(q.id)}));
  const feitas=rs.filter(x=>x.r.status), ok1=rs.filter(x=>x.r.status==='ok1').length, ok=rs.filter(x=>x.r.status==='ok').length, viu=rs.filter(x=>x.r.status==='viu').length;
  const tot=rs.reduce((a,x)=>a+x.r.t,0), med=feitas.length?feitas.reduce((a,x)=>a+x.r.t,0)/feitas.length:0;
  const lenta=feitas.slice().sort((a,b)=>b.r.t-a.r.t)[0];
  let h=`<div class="card"><h2>Relatório${S.nome?' – '+S.nome:''}</h2><p class="small">Gerado em ${new Date().toLocaleString('pt-BR')}</p>
  <div class="stats">
   <div class="stat"><span class="small">Concluídas</span><b>${feitas.length}/${Q.length}</b></div>
   <div class="stat"><span class="small">Acertos de primeira</span><b style="color:var(--ok)">${ok1}</b></div>
   <div class="stat"><span class="small">Acertou após errar</span><b style="color:var(--warn)">${ok}</b></div>
   <div class="stat"><span class="small">Viu a resolução</span><b style="color:var(--bad)">${viu}</b></div>
   <div class="stat"><span class="small">Tempo total</span><b>${fmt(tot)}</b></div>
   <div class="stat"><span class="small">Tempo médio por questão</span><b>${fmt(med)}</b></div>
  </div>
  ${lenta?`<p class="small">Questão mais demorada: nº ${Q.indexOf(lenta.q)+1} (${lenta.q.tema}) – ${fmt(lenta.r.t)}</p>`:''}
  <h3>Por assunto</h3><div class="tw"><table><tr><th>Assunto</th><th>Concluídas</th><th>Acertos de 1ª</th><th>Aproveitamento</th><th>Tempo médio</th></tr>
  ${TEMAS.map(t=>{const g=rs.filter(x=>x.q.tema===t),d=g.filter(x=>x.r.status),a=g.filter(x=>x.r.status==='ok1').length;
   return `<tr><td>${t}</td><td>${d.length}/${g.length}</td><td>${a}</td><td>${d.length?Math.round(a/d.length*100)+'%':'–'}</td><td>${d.length?fmt(d.reduce((s,x)=>s+x.r.t,0)/d.length):'–'}</td></tr>`}).join('')}
  </table></div>
  <h3>Questão por questão</h3><div class="tw"><table><tr><th>Nº</th><th>Assunto</th><th>Situação</th><th>Tentativas</th><th>Tempo</th><th>Respostas dadas</th></tr>
  ${rs.map((x,i)=>`<tr><td>${i+1}</td><td>${x.q.tema}</td><td class="st-${x.r.status}">${x.r.status?stLabel(x.r.status):(x.r.t>0?'Em andamento':'Não feita')}</td><td>${x.r.tent||'–'}</td><td>${x.r.t>0?fmt(x.r.t):'–'}</td><td>${(x.r.resps||[]).join(' · ')||'–'}</td></tr>`).join('')}
  </table></div>
  <div class="actions noprint"><button class="btn p" id="csv">⬇ Baixar planilha (CSV)</button><button class="btn s" id="imp">🖨 Imprimir</button><button class="btn d" id="zera">Apagar todo o progresso</button></div>
  </div>`;
  app.innerHTML=h;
  document.getElementById('imp').onclick=()=>window.print();
  document.getElementById('csv').onclick=()=>{
    const linhas=[['Questao','Assunto','Situacao','Tentativas','Tempo (s)','Tempo (mm:ss)','Respostas']];
    rs.forEach((x,i)=>linhas.push([i+1,x.q.tema,x.r.status?stLabel(x.r.status):'Não feita',x.r.tent,Math.round(x.r.t),fmt(x.r.t),(x.r.resps||[]).join(' | ')]));
    const csv='\ufeff'+linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='relatorio_matematica_'+(S.nome||'aluno').replace(/\s+/g,'_')+'.csv';a.click();
  };
  document.getElementById('zera').onclick=()=>{if(confirm('Apagar todas as respostas e tempos? Isso não pode ser desfeito.')){const n=S.nome;S={nome:n,r:{},atual:0,filtro:'Todos'};save();renderRel()}};
}
function setView(v){view=v;document.getElementById('tabQ').classList.toggle('on',v==='quiz');document.getElementById('tabR').classList.toggle('on',v==='rel');
  if(v==='quiz')renderQuiz();else renderRel();window.scrollTo(0,0)}
document.getElementById('tabQ').onclick=()=>setView('quiz');
document.getElementById('tabR').onclick=()=>setView('rel');
if(S.atual>=Q.length)S.atual=0;
setView('quiz');
</script>
</body>
</html>
